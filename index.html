<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UNICEF Vietnam · KOL Directory &amp; Analytics</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@700;800&display=swap" rel="stylesheet">
<style>*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --unicef:#1CABE2;--unicef-dark:#0C7DAE;--unicef-deep:#005780;--unicef-pale:#E3F4FB;--unicef-pale2:#F2FAFD;
  --navy:#374EA2;--ink:#0F2A3D;--bg:#EAF4FA;--card:#fff;
  --text:#13303F;--muted:#5C7689;--border:#D4E6F0;--fb:#1877F2;--tt:#111;--ig:#E1306C;--yt:#FF0000;
  --radius:14px;--shadow:0 1px 3px rgba(12,125,174,.07),0 10px 28px rgba(12,125,174,.08);
  --sidebar-w:290px;
}
html,body{height:100%}
body{font-family:"Inter",system-ui,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}

/* Header */
.header{background:#fff;padding:14px 26px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:200;box-shadow:0 2px 14px rgba(12,125,174,.12);border-bottom:3px solid var(--unicef)}
.h-logo{height:38px;width:auto;display:block}
.h-divider{width:1px;height:34px;background:var(--border)}
.h-title{color:var(--unicef-deep);font-size:16px;font-weight:800;letter-spacing:-.2px;line-height:1.2}
.h-sub{color:var(--muted);font-size:11px;margin-top:2px;font-weight:500}
.h-count{margin-left:auto;background:var(--unicef);color:#fff;font-size:12.5px;font-weight:700;padding:7px 16px;border-radius:30px;white-space:nowrap;box-shadow:0 2px 8px rgba(28,171,226,.3)}

/* Sort bar */
.sortbar{background:#fff;border-bottom:1px solid var(--border);padding:10px 26px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;position:sticky;top:69px;z-index:150}
.searchwrap{position:relative;flex:1;min-width:200px;max-width:340px}
.searchwrap input{width:100%;padding:9px 13px 9px 36px;border:1.5px solid var(--border);border-radius:9px;font-size:13px;font-family:inherit;outline:none;background:var(--unicef-pale2);color:var(--text);transition:.15s}
.searchwrap input:focus{border-color:var(--unicef);background:#fff;box-shadow:0 0 0 3px rgba(28,171,226,.15)}
.searchwrap svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--unicef);width:15px;height:15px}
.sortgroup{display:flex;align-items:center;gap:0;margin-left:auto;border:1.5px solid var(--border);border-radius:10px;overflow:hidden;background:var(--unicef-pale2);flex-wrap:wrap}
.sortlabel{font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);padding:0 12px;align-self:center}
.sortbtn{padding:8px 12px;background:transparent;border:none;border-left:1px solid var(--border);font-size:11.5px;font-weight:700;font-family:inherit;cursor:pointer;color:var(--muted);transition:.13s;white-space:nowrap}
.sortbtn.active{background:var(--unicef);color:#fff}
.sortbtn:hover:not(.active){background:var(--unicef-pale);color:var(--unicef-deep)}
.platgroup{display:flex;border-left:2px solid var(--border)}
.platgroup .sortbtn:first-child{border-left:none}

/* Layout */
.layout{display:flex;align-items:flex-start;gap:0}
.sidebar{width:var(--sidebar-w);flex-shrink:0;position:sticky;top:124px;height:calc(100vh - 124px);overflow-y:auto;padding:20px 18px 40px;border-right:1px solid var(--border);background:#fff}
.sidebar::-webkit-scrollbar{width:7px}.sidebar::-webkit-scrollbar-thumb{background:#bcdcec;border-radius:4px}
.main{flex:1;min-width:0;padding:20px 26px 60px}

/* Sidebar filters */
.side-h{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.7px;color:var(--unicef-deep);margin:0 0 10px;display:flex;align-items:center;gap:7px}
.side-block{margin-bottom:24px}
.side-block:last-child{margin-bottom:0}
.f-opt{display:flex;align-items:center;justify-content:space-between;padding:7px 10px;border-radius:8px;font-size:12.5px;font-weight:500;color:var(--text);cursor:pointer;transition:.12s;border:1px solid transparent}
.f-opt:hover{background:var(--unicef-pale)}
.f-opt.active{background:var(--unicef);color:#fff;font-weight:700}
.f-opt.active .f-ct{background:rgba(255,255,255,.28);color:#fff}
.f-ct{font-size:10.5px;font-weight:700;color:var(--muted);background:var(--unicef-pale);padding:1px 8px;border-radius:20px;min-width:26px;text-align:center}
.f-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;margin-right:8px}
.f-row{display:flex;align-items:center;flex:1;min-width:0}
.f-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.reset-btn{width:100%;padding:9px;margin-top:4px;border:1.5px solid var(--border);background:#fff;border-radius:9px;font-size:12px;font-weight:700;font-family:inherit;color:var(--muted);cursor:pointer;transition:.13s}
.reset-btn:hover{border-color:var(--unicef);color:var(--unicef-deep);background:var(--unicef-pale2)}

/* Charts */
.charts{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:16px;margin-bottom:22px}
.chart-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px}
.chart-title{font-size:12px;font-weight:800;color:var(--unicef-deep);text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px}
.chart-sub{font-size:11px;color:var(--muted);margin-bottom:14px}
.donut-wrap{display:flex;align-items:center;gap:20px}
.donut{flex-shrink:0}
.donut-center{font-size:22px;font-weight:800;fill:var(--unicef-deep)}
.donut-center-sub{font-size:8px;font-weight:700;fill:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.legend{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0;max-height:170px;overflow-y:auto;padding-right:4px}
.legend::-webkit-scrollbar{width:5px}.legend::-webkit-scrollbar-thumb{background:#bcdcec;border-radius:3px}
.leg-item{display:flex;align-items:center;gap:8px;font-size:11.5px;cursor:pointer;padding:2px 4px;border-radius:5px;transition:.1s}
.leg-item:hover{background:var(--unicef-pale)}
.leg-dot{width:10px;height:10px;border-radius:3px;flex-shrink:0}
.leg-name{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text);font-weight:500}
.leg-val{font-weight:800;color:var(--unicef-deep);font-size:11.5px}
.leg-pct{color:var(--muted);font-size:10px;min-width:34px;text-align:right;font-weight:600}
.hbars{display:flex;flex-direction:column;gap:13px;padding-top:6px}
.hbar-row{display:flex;flex-direction:column;gap:5px;cursor:pointer}
.hbar-row:hover .hbar-label{color:var(--unicef-deep)}
.hbar-top{display:flex;align-items:center;justify-content:space-between;font-size:11.5px}
.hbar-label{display:flex;align-items:center;gap:8px;font-weight:600;transition:.1s}
.hbar-icon{width:18px;height:18px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:9px;color:#fff;font-weight:800}
.hbar-val{font-weight:800;color:var(--unicef-deep)}
.hbar-track{height:10px;background:var(--unicef-pale);border-radius:6px;overflow:hidden}
.hbar-fill{height:100%;border-radius:6px;transition:width .5s cubic-bezier(.4,0,.2,1)}

/* Meta */
.meta{font-size:12.5px;color:var(--muted);margin-bottom:14px;font-weight:500}
.meta b{color:var(--unicef-deep);font-weight:800}

/* Cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px}
.card{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--border);overflow:hidden;display:flex;flex-direction:column;transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-3px);box-shadow:0 12px 32px rgba(12,125,174,.16)}
.card-head{padding:16px 16px 0}
.card-top{display:flex;gap:13px;align-items:flex-start;margin-bottom:11px}
.avatar{width:54px;height:54px;border-radius:13px;flex-shrink:0;position:relative;overflow:hidden;background:linear-gradient(135deg,var(--unicef),var(--unicef-deep));display:flex;align-items:center;justify-content:center}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.avatar .initials{font-family:"Sora",sans-serif;font-weight:800;font-size:18px;color:#fff;letter-spacing:-1px}
.avatar .pp-badge{position:absolute;bottom:-2px;right:-2px;width:20px;height:20px;border-radius:50%;border:2.5px solid #fff;display:flex;align-items:center;justify-content:center}
.card-id{flex:1;min-width:0}
.card-name{font-size:15px;font-weight:800;color:var(--text);letter-spacing:-.3px;line-height:1.25}
.card-name a{color:inherit;text-decoration:none}
.card-name a:hover{color:var(--unicef-deep)}
.card-badges{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.tier-badge{font-size:9px;font-weight:800;padding:3px 8px;border-radius:20px;letter-spacing:.3px;text-transform:uppercase}
.tier-Mega{background:#E0E7FF;color:#3730A3}.tier-Macro{background:#DBEAFE;color:#1E40AF}
.tier-Mid{background:#CFFAFE;color:#155E75}.tier-Micro{background:#E3F4FB;color:#0C7DAE}
.tier-Nano{background:#EEF2F6;color:#475569}
.sector-badge{font-size:9px;font-weight:700;padding:3px 8px;border-radius:20px;background:var(--unicef-pale);color:var(--unicef-deep)}
.card-bio{font-size:12px;color:var(--muted);line-height:1.55;margin:0 16px 13px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card-divider{height:1px;background:var(--border)}
.card-plats{padding:11px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.plat-row{display:grid;grid-template-columns:22px 1fr auto auto;align-items:center;gap:9px;padding:8px 10px;border-radius:8px;background:var(--unicef-pale2);font-size:12px;text-decoration:none;color:inherit;transition:.12s;border:1px solid transparent}
.plat-row:hover{background:var(--unicef-pale);border-color:#bce0f0}
.plat-row.is-primary{background:var(--unicef-pale);border-color:var(--unicef);box-shadow:inset 3px 0 0 var(--unicef)}
.plat-ic{width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:#fff}
.plat-ic.tt{background:var(--tt)}.plat-ic.ig{background:linear-gradient(135deg,#F58529,#DD2A7B,#8134AF)}
.plat-ic.yt{background:var(--yt)}.plat-ic.fb{background:var(--fb)}
.plat-meta{min-width:0}
.plat-handle{font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11.5px}
.plat-sub{font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;font-weight:700}
.plat-fol{font-weight:800;color:var(--unicef-deep);font-size:12.5px;text-align:right;white-space:nowrap}
.plat-er{font-size:10px;font-weight:700;text-align:right;white-space:nowrap;padding:2px 6px;border-radius:5px}
.er-hi{background:#CFFAFE;color:#155E75}.er-mid{background:#E3F4FB;color:#0C7DAE}.er-lo{background:#EEF2F6;color:#64748B}
.empty{text-align:center;padding:80px 20px;color:var(--muted)}
.empty h3{font-size:17px;color:var(--text);margin-bottom:6px}

@media(max-width:1100px){.charts{grid-template-columns:1fr}.sidebar{position:static;height:auto;width:250px}}
@media(max-width:820px){.layout{flex-direction:column}.sidebar{width:100%;position:static;height:auto;border-right:none;border-bottom:1px solid var(--border)}}
</style>
</head>

const PLATS=["tiktok","instagram","youtube","facebook"];
const PLABEL={tiktok:"TikTok",instagram:"Instagram",youtube:"YouTube",facebook:"Facebook"};
const PSHORT={tiktok:"TT",instagram:"IG",youtube:"YT",facebook:"FB"};
const PCLASS={tiktok:"tt",instagram:"ig",youtube:"yt",facebook:"fb"};
const PCOLOR={tiktok:"#111111",instagram:"#DD2A7B",youtube:"#FF0000",facebook:"#1877F2"};
// UNICEF-blue derived sector palette (blues/teals/indigos, on-brand)
const SECTOR_COLORS=["#1CABE2","#0C7DAE","#005780","#374EA2","#2563EB","#0891B2","#0E7490","#3730A3","#1D4ED8","#0369A1","#155E75","#1E40AF","#4F46E5","#0284C7","#075985"];

function computePrimary(d){
  let best=null;
  for(const p of PLATS){
    const pl=d[p]; if(!pl) continue;
    const hasAny = pl.link||pl.followers!=null||pl.er!=null;
    if(!hasAny) continue;
    const er = pl.er!=null?pl.er:-1;
    const fol= pl.followers!=null?pl.followers:-1;
    const cand=[er,fol,p];
    if(!best || cand[0]>best[0] || (cand[0]===best[0]&&cand[1]>best[1])) best=cand;
  }
  return best?best[2]:null;
}
function bestFollowers(d){let m=0;for(const p of PLATS){const pl=d[p];if(pl&&pl.followers)m=Math.max(m,pl.followers);}return m;}
DATA.forEach(d=>{d._primary=computePrimary(d);d._best=bestFollowers(d);});

function norm(s){return (s||"").toString().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/đ/g,"d");}
function fmt(n){if(n==null)return null;if(n>=1e6)return (n/1e6).toFixed(n>=1e7?0:1).replace(/\.0$/,"")+"M";if(n>=1e3)return Math.round(n/1e3)+"K";return ""+n;}

let state={q:"",sector:"All",platform:"All",tier:"All",sortMetric:"followers",sortPlat:"best"};

function filtered(){
  const q=norm(state.q);
  return DATA.filter(d=>{
    if(q){const hit=[d.name,d.tiktok&&d.tiktok.username,d.instagram&&d.instagram.username,d.youtube&&d.youtube.username,d.bio].some(s=>norm(s).includes(q));if(!hit)return false;}
    if(state.sector!=="All"&&d.sector!==state.sector)return false;
    if(state.tier!=="All"&&d.tier!==state.tier)return false;
    if(state.platform!=="All"&&d._primary!==state.platform)return false;
    return true;
  });
}
function sortVal(d){
  if(state.sortMetric==="name")return null;
  const usePlat=state.sortPlat!=="best"?state.sortPlat:null;
  if(state.sortMetric==="followers"){
    if(usePlat){const pl=d[usePlat];return pl&&pl.followers?pl.followers:-1;}
    return d._best;
  }else{
    if(usePlat){const pl=d[usePlat];return pl&&pl.er!=null?pl.er:-1;}
    let m=-1;for(const p of PLATS){const pl=d[p];if(pl&&pl.er!=null)m=Math.max(m,pl.er);}return m;
  }
}

function renderCharts(rows){
  const total=rows.length||1;
  // SECTOR donut
  const secCount={};rows.forEach(d=>secCount[d.sector]=(secCount[d.sector]||0)+1);
  const secEntries=Object.entries(secCount).sort((a,b)=>b[1]-a[1]);
  const secColorMap={};secEntries.forEach(([n],i)=>secColorMap[n]=SECTOR_COLORS[i%SECTOR_COLORS.length]);
  const C=2*Math.PI*54;let donut="",off=0;
  secEntries.forEach(([name,ct])=>{const frac=ct/total,len=frac*C,col=secColorMap[name];
    donut+=`<circle cx="68" cy="68" r="54" fill="none" stroke="${col}" stroke-width="20" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 68 68)"><title>${name}: ${ct} (${(frac*100).toFixed(1)}%)</title></circle>`;off+=len;});
  const secLegend=secEntries.map(([name,ct])=>`<div class="leg-item" onclick="setFilter('sector','${name.replace(/'/g,"\\'")}')"><span class="leg-dot" style="background:${secColorMap[name]}"></span><span class="leg-name">${name}</span><span class="leg-pct">${(ct/total*100).toFixed(0)}%</span><span class="leg-val">${ct}</span></div>`).join("");

  // TIER donut
  const tierCount={};rows.forEach(d=>tierCount[d.tier]=(tierCount[d.tier]||0)+1);
  const tierOrder=["Mega","Macro","Mid","Micro","Nano"];
  const tierColor={Mega:"#3730A3",Macro:"#1D4ED8",Mid:"#0891B2",Micro:"#1CABE2",Nano:"#94A3B8"};
  let tDonut="",tOff=0;
  tierOrder.forEach(t=>{const ct=tierCount[t]||0;if(!ct)return;const frac=ct/total,len=frac*C;
    tDonut+=`<circle cx="68" cy="68" r="54" fill="none" stroke="${tierColor[t]}" stroke-width="20" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-tOff}" transform="rotate(-90 68 68)"><title>${t}: ${ct}</title></circle>`;tOff+=len;});
  const tierLegend=tierOrder.filter(t=>tierCount[t]).map(t=>`<div class="leg-item" onclick="setFilter('tier','${t}')"><span class="leg-dot" style="background:${tierColor[t]}"></span><span class="leg-name">${t}</span><span class="leg-pct">${((tierCount[t]||0)/total*100).toFixed(0)}%</span><span class="leg-val">${tierCount[t]||0}</span></div>`).join("");

  // PLATFORM bars = PRIMARY channel counts only
  const pCount={tiktok:0,instagram:0,youtube:0,facebook:0};
  rows.forEach(d=>{if(d._primary)pCount[d._primary]++;});
  const pMax=Math.max(1,...Object.values(pCount));
  const pBars=PLATS.map(p=>{const ct=pCount[p],pct=(ct/total*100);
    const bg=p==='instagram'?'linear-gradient(135deg,#F58529,#DD2A7B,#8134AF)':PCOLOR[p];
    const bgbar=p==='instagram'?'linear-gradient(90deg,#F58529,#DD2A7B,#8134AF)':PCOLOR[p];
    return `<div class="hbar-row" onclick="setFilter('platform','${p}')"><div class="hbar-top"><span class="hbar-label"><span class="hbar-icon" style="background:${bg}">${PSHORT[p]}</span>${PLABEL[p]}</span><span class="hbar-val">${ct} <span style="color:var(--muted);font-weight:600;font-size:10px">· ${pct.toFixed(0)}%</span></span></div><div class="hbar-track"><div class="hbar-fill" style="width:${ct/pMax*100}%;background:${bgbar}"></div></div></div>`;}).join("");

  document.getElementById("charts").innerHTML=`
    <div class="chart-card">
      <div class="chart-title">Sector Split</div>
      <div class="chart-sub">${secEntries.length} sectors · click to filter</div>
      <div class="donut-wrap">
        <svg class="donut" width="136" height="136" viewBox="0 0 136 136">${donut}
          <text class="donut-center" x="68" y="66" text-anchor="middle">${total}</text>
          <text class="donut-center-sub" x="68" y="80" text-anchor="middle">KOLs</text></svg>
        <div class="legend">${secLegend}</div>
      </div>
    </div>
    <div class="chart-card">
      <div class="chart-title">Tier Split</div>
      <div class="chart-sub">By follower-size tier · click to filter</div>
      <div class="donut-wrap">
        <svg class="donut" width="136" height="136" viewBox="0 0 136 136">${tDonut}
          <text class="donut-center" x="68" y="66" text-anchor="middle">${total}</text>
          <text class="donut-center-sub" x="68" y="80" text-anchor="middle">KOLs</text></svg>
        <div class="legend">${tierLegend}</div>
      </div>
    </div>
    <div class="chart-card">
      <div class="chart-title">Primary Platform</div>
      <div class="chart-sub">Count of KOLs whose best-engagement channel is each platform</div>
      <div class="hbars">${pBars}</div>
    </div>`;
}

function renderSidebar(){
  function countBy(key,val){
    return DATA.filter(d=>{
      if(state.q){const q=norm(state.q);const hit=[d.name,d.bio].some(s=>norm(s).includes(q));if(!hit)return false;}
      if(key!=="sector"&&state.sector!=="All"&&d.sector!==state.sector)return false;
      if(key!=="tier"&&state.tier!=="All"&&d.tier!==state.tier)return false;
      if(key!=="platform"&&state.platform!=="All"&&d._primary!==state.platform)return false;
      if(key==="sector")return d.sector===val;
      if(key==="tier")return d.tier===val;
      if(key==="platform")return d._primary===val;
      return true;
    }).length;
  }
  const sectors=[...new Set(DATA.map(d=>d.sector))].sort((a,b)=>countBy("sector",b)-countBy("sector",a));
  const tiers=["Mega","Macro","Mid","Micro","Nano"];
  const secColors={};sectors.forEach((s,i)=>secColors[s]=SECTOR_COLORS[i%SECTOR_COLORS.length]);
  const tierColor={Mega:"#3730A3",Macro:"#1D4ED8",Mid:"#0891B2",Micro:"#1CABE2",Nano:"#94A3B8"};
  function opt(key,val,label,dot){
    const active=state[key]===val;
    const ct=countBy(key,val);
    const dotHtml=dot?`<span class="f-dot" style="background:${dot}"></span>`:"";
    return `<div class="f-opt ${active?'active':''}" onclick="setFilter('${key}','${val.replace(/'/g,"\\'")}')"><span class="f-row">${dotHtml}<span class="f-name">${label}</span></span>${val==='All'?'':`<span class="f-ct">${ct}</span>`}</div>`;
  }
  document.getElementById("sidebar").innerHTML=`
    <div class="side-block"><div class="side-h">Tier</div>${opt("tier","All","All tiers")}${tiers.map(t=>opt("tier",t,t,tierColor[t])).join("")}</div>
    <div class="side-block"><div class="side-h">Primary Platform</div>${opt("platform","All","All platforms")}${PLATS.map(p=>opt("platform",p,PLABEL[p],PCOLOR[p])).join("")}</div>
    <div class="side-block"><div class="side-h">Sector</div>${opt("sector","All","All sectors")}${sectors.map(s=>opt("sector",s,s,secColors[s])).join("")}</div>
    <div class="side-block"><button class="reset-btn" onclick="resetFilters()">↺ Reset all filters</button></div>`;
}

function erClass(er){if(er==null)return"er-lo";if(er>=5)return"er-hi";if(er>=2)return"er-mid";return"er-lo";}
function initials(name){const parts=name.trim().split(/\s+/).filter(w=>/[\p{L}]/u.test(w));const a=parts[parts.length-2]||parts[0]||"";const b=parts[parts.length-1]||"";return ((a[0]||"")+(b[0]||"")).toUpperCase();}

function avatarHtml(d){
  const init=initials(d.name);
  const p=d._primary;
  // Build an ordered list of candidate photo URLs, all tied to the creator's OWN verified handles.
  const cands=[];
  if(d.photo_url) cands.push(d.photo_url);
  const order=[p,"instagram","tiktok","youtube"].filter(Boolean);
  const seen={};
  for(const pl of order){
    if(seen[pl]) continue; seen[pl]=1;
    const o=d[pl];
    if(o&&o.username){
      const u=encodeURIComponent(o.username.replace(/^@/,""));
      if(pl==="instagram")cands.push(`https://unavatar.io/instagram/${u}?fallback=false`);
      else if(pl==="tiktok")cands.push(`https://unavatar.io/tiktok/${u}?fallback=false`);
      else if(pl==="youtube")cands.push(`https://unavatar.io/youtube/${u}?fallback=false`);
    }
  }
  const ppIcon=p?`<span class="pp-badge" style="background:${p==='instagram'?'#DD2A7B':PCOLOR[p]}" title="Best-engagement platform: ${PLABEL[p]}"><span style="font-size:8px;color:#fff;font-weight:800">${PSHORT[p]}</span></span>`:"";
  if(cands.length){
    // chain: on error, advance to the next candidate; if all fail, show initials
    const chain=JSON.stringify(cands).replace(/"/g,"&quot;");
    return `<div class="avatar"><img src="${cands[0]}" loading="lazy" alt="${d.name}" data-cands="${chain}" data-i="0" onerror="(function(im){var c=JSON.parse(im.getAttribute('data-cands'));var i=+im.getAttribute('data-i')+1;if(i&lt;c.length){im.setAttribute('data-i',i);im.src=c[i];}else{im.style.display='none';im.nextElementSibling.style.display='flex';}})(this)"><span class="initials" style="display:none">${init}</span>${ppIcon}</div>`;
  }
  return `<div class="avatar"><span class="initials">${init}</span>${ppIcon}</div>`;
}
function __avatarOldRemoved(){}

function platRow(d,p){
  const pl=d[p];if(!pl||(!pl.link&&!pl.followers&&pl.er==null))return "";
  const isPrim=d._primary===p;
  const handle=pl.username?("@"+pl.username.replace(/^@/,"")):PLABEL[p];
  const folHtml = pl.followers!=null?`<span class="plat-fol">${fmt(pl.followers)}</span>`:`<span class="plat-fol" style="color:#c2d6e2">—</span>`;
  const erHtml = pl.er!=null?`<span class="plat-er ${erClass(pl.er)}">${pl.er.toFixed(1)}%</span>`:`<span class="plat-er er-lo">·</span>`;
  const open=pl.link?`href="${pl.link}" target="_blank" rel="noopener"`:"";
  return `<a class="plat-row ${isPrim?'is-primary':''}" ${open}>
    <span class="plat-ic ${PCLASS[p]}">${PSHORT[p]}</span>
    <span class="plat-meta"><span class="plat-handle">${handle}</span><span class="plat-sub">${PLABEL[p]}</span></span>
    ${folHtml}${erHtml}</a>`;
}

function card(d){
  const primLink=(d._primary&&d[d._primary]&&d[d._primary].link)||(PLATS.map(p=>d[p]&&d[p].link).find(Boolean));
  const nameHtml=primLink?`<a href="${primLink}" target="_blank" rel="noopener">${d.name}</a>`:d.name;
  return `<div class="card"><div class="card-head"><div class="card-top">
    ${avatarHtml(d)}
    <div class="card-id"><div class="card-name">${nameHtml}</div>
      <div class="card-badges"><span class="tier-badge tier-${d.tier}">${d.tier}</span><span class="sector-badge">${d.sector}</span></div></div>
    </div></div>
    <div class="card-bio">${d.bio||""}</div><div class="card-divider"></div>
    <div class="card-plats">${PLATS.map(p=>platRow(d,p)).join("")}</div></div>`;
}

function render(){
  const rows=filtered();
  rows.sort((a,b)=>state.sortMetric==="name"?norm(a.name).localeCompare(norm(b.name)):sortVal(b)-sortVal(a));
  renderCharts(rows);renderSidebar();
  document.querySelectorAll(".sortbtn[data-metric]").forEach(b=>b.classList.toggle("active",b.dataset.metric===state.sortMetric));
  document.querySelectorAll(".sortbtn[data-plat]").forEach(b=>b.classList.toggle("active",b.dataset.plat===state.sortPlat));
  document.getElementById("meta").innerHTML=rows.length===DATA.length?`Showing all <b>${DATA.length}</b> profiles`:`Showing <b>${rows.length}</b> of <b>${DATA.length}</b> profiles`;
  document.getElementById("count").textContent=`${rows.length} profiles`;
  const grid=document.getElementById("grid");
  if(!rows.length)grid.innerHTML=`<div class="empty" style="grid-column:1/-1"><h3>No matches</h3><p>Try clearing a filter or searching a different name.</p></div>`;
  else grid.innerHTML=rows.map(card).join("");
}

function setFilter(key,val){state[key]=val;render();window.scrollTo({top:0,behavior:'smooth'});}
function resetFilters(){state={q:"",sector:"All",platform:"All",tier:"All",sortMetric:"followers",sortPlat:"best"};document.getElementById("search").value="";render();}
function setSort(m){state.sortMetric=m;render();}
function setSortPlat(p){state.sortPlat=p;render();}
document.getElementById("search").addEventListener("input",e=>{state.q=e.target.value;render();});
render();

</script>
