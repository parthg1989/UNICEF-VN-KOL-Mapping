<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UNICEF Vietnam · KOL Directory &amp; Analytics</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@700;800&display=swap" rel="stylesheet">
<style>*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --unicef:#1CABE2;--unicef-dark:#0C7DAE;--unicef-deep:#005780;--unicef-pale:#E3F4FB;--unicef-pale2:#F2FAFD;
  --navy:#374EA2;--ink:#0F2A3D;--bg:#EAF4FA;--card:#fff;
  --text:#13303F;--muted:#5C7689;--border:#D4E6F0;--fb:#1877F2;--tt:#111;--ig:#E1306C;--yt:#FF0000;
  --radius:14px;--shadow:0 1px 3px rgba(12,125,174,.07),0 10px 28px rgba(12,125,174,.08);
  --sidebar-w:290px;
}
html,body{min-height:100%}
body{font-family:"Inter",system-ui,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}

/* Header */
.header{background:#fff;padding:14px 26px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:200;box-shadow:0 2px 14px rgba(12,125,174,.12);border-bottom:3px solid var(--unicef)}
.h-logo{height:38px;width:auto;display:block}
.h-divider{width:1px;height:34px;background:var(--border)}
.h-title{color:var(--unicef-deep);font-size:16px;font-weight:800;letter-spacing:-.2px;line-height:1.2}
.h-sub{color:var(--muted);font-size:11px;margin-top:2px;font-weight:500}
.h-count{margin-left:auto;background:var(--unicef);color:#fff;font-size:12.5px;font-weight:700;padding:7px 16px;border-radius:30px;white-space:nowrap;box-shadow:0 2px 8px rgba(28,171,226,.3)}

/* Sort bar */
.sortbar{background:#fff;border-bottom:1px solid var(--border);padding:10px 26px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;position:sticky;top:69px;z-index:150}
.searchwrap{position:relative;flex:1;min-width:200px;max-width:340px}
.searchwrap input{width:100%;padding:9px 13px 9px 36px;border:1.5px solid var(--border);border-radius:9px;font-size:13px;font-family:inherit;outline:none;background:var(--unicef-pale2);color:var(--text);transition:.15s}
.searchwrap input:focus{border-color:var(--unicef);background:#fff;box-shadow:0 0 0 3px rgba(28,171,226,.15)}
.searchwrap svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--unicef);width:15px;height:15px}
.sortgroup{display:flex;align-items:center;gap:0;margin-left:auto;border:1.5px solid var(--border);border-radius:10px;overflow:hidden;background:var(--unicef-pale2);flex-wrap:wrap}
.sortlabel{font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);padding:0 12px;align-self:center}
.sortbtn{padding:8px 12px;background:transparent;border:none;border-left:1px solid var(--border);font-size:11.5px;font-weight:700;font-family:inherit;cursor:pointer;color:var(--muted);transition:.13s;white-space:nowrap}
.sortbtn.active{background:var(--unicef);color:#fff}
.sortbtn:hover:not(.active){background:var(--unicef-pale);color:var(--unicef-deep)}
.platgroup{display:flex;border-left:2px solid var(--border)}
.platgroup .sortbtn:first-child{border-left:none}

/* Layout */
.layout{display:flex;align-items:flex-start;gap:0}
.sidebar{width:var(--sidebar-w);flex-shrink:0;position:sticky;top:124px;height:calc(100vh - 124px);overflow-y:auto;padding:20px 18px 40px;border-right:1px solid var(--border);background:#fff}
.sidebar::-webkit-scrollbar{width:7px}.sidebar::-webkit-scrollbar-thumb{background:#bcdcec;border-radius:4px}
.main{flex:1;min-width:0;padding:20px 26px 60px}

/* Sidebar filters */
.side-h{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.7px;color:var(--unicef-deep);margin:0 0 10px;display:flex;align-items:center;gap:7px}
.side-block{margin-bottom:24px}
.side-block:last-child{margin-bottom:0}
.f-opt{display:flex;align-items:center;justify-content:space-between;padding:7px 10px;border-radius:8px;font-size:12.5px;font-weight:500;color:var(--text);cursor:pointer;transition:.12s;border:1px solid transparent}
.f-opt:hover{background:var(--unicef-pale)}
.f-opt.active{background:var(--unicef);color:#fff;font-weight:700}
.f-opt.active .f-ct{background:rgba(255,255,255,.28);color:#fff}
.f-ct{font-size:10.5px;font-weight:700;color:var(--muted);background:var(--unicef-pale);padding:1px 8px;border-radius:20px;min-width:26px;text-align:center}
.f-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;margin-right:8px}
.f-row{display:flex;align-items:center;flex:1;min-width:0}
.f-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.reset-btn{width:100%;padding:9px;margin-top:4px;border:1.5px solid var(--border);background:#fff;border-radius:9px;font-size:12px;font-weight:700;font-family:inherit;color:var(--muted);cursor:pointer;transition:.13s}
.reset-btn:hover{border-color:var(--unicef);color:var(--unicef-deep);background:var(--unicef-pale2)}

/* Charts */
.charts{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:16px;margin-bottom:22px}
.chart-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px}
.chart-title{font-size:12px;font-weight:800;color:var(--unicef-deep);text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px}
.chart-sub{font-size:11px;color:var(--muted);margin-bottom:14px}
.donut-wrap{display:flex;align-items:center;gap:20px}
.donut{flex-shrink:0}
.donut-center{font-size:22px;font-weight:800;fill:var(--unicef-deep)}
.donut-center-sub{font-size:8px;font-weight:700;fill:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.legend{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0;max-height:170px;overflow-y:auto;padding-right:4px}
.legend::-webkit-scrollbar{width:5px}.legend::-webkit-scrollbar-thumb{background:#bcdcec;border-radius:3px}
.leg-item{display:flex;align-items:center;gap:8px;font-size:11.5px;cursor:pointer;padding:2px 4px;border-radius:5px;transition:.1s}
.leg-item:hover{background:var(--unicef-pale)}
.leg-dot{width:10px;height:10px;border-radius:3px;flex-shrink:0}
.leg-name{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text);font-weight:500}
.leg-val{font-weight:800;color:var(--unicef-deep);font-size:11.5px}
.leg-pct{color:var(--muted);font-size:10px;min-width:34px;text-align:right;font-weight:600}
.hbars{display:flex;flex-direction:column;gap:13px;padding-top:6px}
.hbar-row{display:flex;flex-direction:column;gap:5px;cursor:pointer}
.hbar-row:hover .hbar-label{color:var(--unicef-deep)}
.hbar-top{display:flex;align-items:center;justify-content:space-between;font-size:11.5px}
.hbar-label{display:flex;align-items:center;gap:8px;font-weight:600;transition:.1s}
.hbar-icon{width:18px;height:18px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:9px;color:#fff;font-weight:800}
.hbar-val{font-weight:800;color:var(--unicef-deep)}
.hbar-track{height:10px;background:var(--unicef-pale);border-radius:6px;overflow:hidden}
.hbar-fill{height:100%;border-radius:6px;transition:width .5s cubic-bezier(.4,0,.2,1)}

/* Meta */
.meta{font-size:12.5px;color:var(--muted);margin-bottom:14px;font-weight:500}
.meta b{color:var(--unicef-deep);font-weight:800}

/* Cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px}
.card{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--border);overflow:hidden;display:flex;flex-direction:column;transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-3px);box-shadow:0 12px 32px rgba(12,125,174,.16)}
.card-head{padding:16px 16px 0}
.card-top{display:flex;gap:13px;align-items:flex-start;margin-bottom:11px}
.avatar{width:54px;height:54px;border-radius:13px;flex-shrink:0;position:relative;overflow:hidden;background:linear-gradient(135deg,var(--unicef),var(--unicef-deep));display:flex;align-items:center;justify-content:center}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.avatar .initials{font-family:"Sora",sans-serif;font-weight:800;font-size:18px;color:#fff;letter-spacing:-1px}
.avatar .pp-badge{position:absolute;bottom:-2px;right:-2px;width:20px;height:20px;border-radius:50%;border:2.5px solid #fff;display:flex;align-items:center;justify-content:center}
.card-id{flex:1;min-width:0}
.card-name{font-size:15px;font-weight:800;color:var(--text);letter-spacing:-.3px;line-height:1.25}
.card-name a{color:inherit;text-decoration:none}
.card-name a:hover{color:var(--unicef-deep)}
.card-badges{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.tier-badge{font-size:9px;font-weight:800;padding:3px 8px;border-radius:20px;letter-spacing:.3px;text-transform:uppercase}
.tier-Mega{background:#E0E7FF;color:#3730A3}.tier-Macro{background:#DBEAFE;color:#1E40AF}
.tier-Mid{background:#CFFAFE;color:#155E75}.tier-Micro{background:#E3F4FB;color:#0C7DAE}
.tier-Nano{background:#EEF2F6;color:#475569}
.sector-badge{font-size:9px;font-weight:700;padding:3px 8px;border-radius:20px;background:var(--unicef-pale);color:var(--unicef-deep)}
.card-bio{font-size:12px;color:var(--muted);line-height:1.55;margin:0 16px 13px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card-divider{height:1px;background:var(--border)}
.card-plats{padding:11px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.plat-row{display:grid;grid-template-columns:22px 1fr auto auto;align-items:center;gap:9px;padding:8px 10px;border-radius:8px;background:var(--unicef-pale2);font-size:12px;text-decoration:none;color:inherit;transition:.12s;border:1px solid transparent}
.plat-row:hover{background:var(--unicef-pale);border-color:#bce0f0}
.plat-row.is-primary{background:var(--unicef-pale);border-color:var(--unicef);box-shadow:inset 3px 0 0 var(--unicef)}
.plat-ic{width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:#fff}
.plat-ic.tt{background:var(--tt)}.plat-ic.ig{background:linear-gradient(135deg,#F58529,#DD2A7B,#8134AF)}
.plat-ic.yt{background:var(--yt)}.plat-ic.fb{background:var(--fb)}
.plat-meta{min-width:0}
.plat-handle{font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11.5px}
.plat-sub{font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;font-weight:700}
.plat-fol{font-weight:800;color:var(--unicef-deep);font-size:12.5px;text-align:right;white-space:nowrap}
.plat-er{font-size:10px;font-weight:700;text-align:right;white-space:nowrap;padding:2px 6px;border-radius:5px}
.er-hi{background:#CFFAFE;color:#155E75}.er-mid{background:#E3F4FB;color:#0C7DAE}.er-lo{background:#EEF2F6;color:#64748B}
.empty{text-align:center;padding:80px 20px;color:var(--muted)}
.empty h3{font-size:17px;color:var(--text);margin-bottom:6px}

@media(max-width:1100px){.charts{grid-template-columns:1fr}.sidebar{position:static;height:auto;width:250px}}
@media(max-width:820px){.layout{flex-direction:column}.sidebar{width:100%;position:static;height:auto;border-right:none;border-bottom:1px solid var(--border)}}

/* Tabs */
.tabs{display:flex;gap:0;background:#fff;padding:0 26px;border-bottom:1px solid var(--border);position:sticky;top:69px;z-index:151}
.tab{padding:13px 22px;background:none;border:none;border-bottom:3px solid transparent;font-family:inherit;font-size:13.5px;font-weight:700;color:var(--muted);cursor:pointer;transition:.14s;display:flex;align-items:center;gap:9px;margin-bottom:-1px}
.tab:hover{color:var(--unicef-deep)}
.tab.active{color:var(--unicef-deep);border-bottom-color:var(--unicef)}
.tab .tab-ct{font-size:11px;font-weight:800;background:var(--unicef-pale);color:var(--unicef-deep);padding:2px 9px;border-radius:20px}
.tab.active .tab-ct{background:var(--unicef);color:#fff}
/* when tabs present, sortbar sits below them */
.has-tabs .sortbar{top:118px}
.has-tabs .sidebar{top:173px;height:calc(100vh - 173px)}

/* UNICEF contracted tag + ribbon */
.unicef-tag{font-size:8.5px;font-weight:800;padding:3px 8px;border-radius:20px;letter-spacing:.3px;text-transform:uppercase;background:var(--unicef);color:#fff;display:inline-flex;align-items:center;gap:4px}
.card.is-unicef{border-color:var(--unicef);box-shadow:0 0 0 1.5px var(--unicef),var(--shadow)}
.card.is-unicef .card-head{background:linear-gradient(180deg,var(--unicef-pale2),#fff)}
.top60-tag{font-size:8.5px;font-weight:800;padding:3px 8px;border-radius:20px;letter-spacing:.3px;text-transform:uppercase;background:#3730A3;color:#fff}

/* View-details control */
.card-more{display:flex;align-items:center;justify-content:center;gap:6px;margin:0 14px 12px;padding:8px;border:1px solid var(--border);border-radius:9px;background:#fff;font-size:11.5px;font-weight:700;font-family:inherit;color:var(--unicef-deep);cursor:pointer;transition:.13s}
.card-more:hover{background:var(--unicef-pale);border-color:var(--unicef)}
.card-scores{margin:0 14px 12px;display:flex;flex-direction:column;gap:5px}
.score-row{display:flex;align-items:center;gap:8px}
.score-lbl{font-size:9.5px;font-weight:700;flex:0 0 110px;color:var(--muted);text-transform:uppercase;letter-spacing:.3px}
.score-track{flex:1;height:6px;background:var(--border);border-radius:3px;overflow:hidden}
.score-fill{height:100%;border-radius:3px;transition:width .4s}
.score-val{font-size:10.5px;font-weight:800;flex:0 0 28px;text-align:right}
.score-eng{background:linear-gradient(90deg,#1CABE2,#374EA2)}
.score-risk-low{background:linear-gradient(90deg,#10B981,#059669)}
.score-risk-mid{background:linear-gradient(90deg,#F59E0B,#D97706)}
.score-risk-hi{background:linear-gradient(90deg,#EF4444,#DC2626)}
.score-partner{background:linear-gradient(90deg,#8B5CF6,#6D28D9)}
.sortbar-reset{font-size:11px;font-weight:700;font-family:inherit;padding:6px 12px;border:1.5px solid var(--border);border-radius:8px;background:#fff;color:var(--muted);cursor:pointer;transition:.13s;white-space:nowrap;display:none}
.sortbar-reset.visible{display:block}
.sortbar-reset:hover{border-color:var(--unicef);color:var(--unicef-deep);background:var(--unicef-pale2)}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(15,42,61,.55);backdrop-filter:blur(3px);z-index:500;display:none;align-items:flex-start;justify-content:center;padding:40px 20px;overflow-y:auto}
.modal-overlay.open{display:flex}
.modal{background:#fff;border-radius:18px;max-width:600px;width:100%;box-shadow:0 24px 60px rgba(15,42,61,.35);overflow:hidden;animation:pop .18s ease}
@keyframes pop{from{transform:translateY(12px) scale(.98);opacity:0}to{transform:none;opacity:1}}
.modal-head{padding:22px 24px;background:linear-gradient(135deg,var(--unicef),var(--unicef-deep));color:#fff;display:flex;gap:16px;align-items:flex-start;position:relative}
.modal-head.plain{background:linear-gradient(135deg,#5C7689,#374EA2)}
.modal-avatar{width:66px;height:66px;border-radius:15px;flex-shrink:0;overflow:hidden;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;border:2px solid rgba(255,255,255,.5)}
.modal-avatar img{width:100%;height:100%;object-fit:cover}
.modal-avatar .initials{font-family:"Sora",sans-serif;font-weight:800;font-size:22px;color:#fff}
.modal-hid{flex:1;min-width:0}
.modal-name{font-size:20px;font-weight:800;letter-spacing:-.3px;line-height:1.2}
.modal-badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.modal-badges .b{font-size:9.5px;font-weight:800;padding:3px 9px;border-radius:20px;text-transform:uppercase;letter-spacing:.3px;background:rgba(255,255,255,.22);color:#fff}
.modal-close{position:absolute;top:14px;right:16px;width:30px;height:30px;border-radius:50%;border:none;background:rgba(255,255,255,.2);color:#fff;font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.13s}
.modal-close:hover{background:rgba(255,255,255,.35)}
.modal-body{padding:22px 24px}
.modal-sec{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:0 0 8px}
.modal-bio{font-size:13.5px;line-height:1.65;color:var(--text);margin-bottom:20px;white-space:pre-wrap}
.modal-plats{display:flex;flex-direction:column;gap:8px}
.modal-plat{display:grid;grid-template-columns:26px 1fr auto auto;gap:12px;align-items:center;padding:11px 13px;border-radius:10px;background:var(--unicef-pale2);text-decoration:none;color:inherit;border:1px solid transparent;transition:.12s}
.modal-plat:hover{background:var(--unicef-pale);border-color:#bce0f0}
.modal-plat.is-primary{background:var(--unicef-pale);border-color:var(--unicef);box-shadow:inset 3px 0 0 var(--unicef)}
.modal-plat .plat-ic{width:26px;height:26px;border-radius:7px;font-size:11px}
.mp-badges{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
.aqs-badge,.bs-badge{font-size:9.5px;font-weight:800;padding:2px 7px;border-radius:20px;letter-spacing:.2px;white-space:nowrap}
.aqs-ex{background:#D1FAE5;color:#065F46}.aqs-go{background:#DBEAFE;color:#1E40AF}.aqs-av{background:#FEF3C7;color:#92400E}.aqs-po{background:#FEE2E2;color:#991B1B}
.bs-safe{background:#D1FAE5;color:#065F46}.bs-risky{background:#FEF3C7;color:#92400E}.bs-unsafe{background:#FEE2E2;color:#991B1B}
/* ---- Tooltips (rendered into body via JS, never clipped) ---- */
[data-tip]{cursor:help}
#tt{position:fixed;z-index:9999;background:#0F2A3D;color:#fff;font-size:12px;font-weight:400;line-height:1.6;padding:10px 13px;border-radius:10px;max-width:240px;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.35);font-family:inherit;text-align:left;letter-spacing:0;white-space:pre-wrap;display:none;transition:opacity .12s}
#tt.show{display:block}
#tt::after{content:'';position:absolute;border:5px solid transparent}
#tt.tt-above::after{top:100%;left:var(--ax,50%);transform:translateX(-50%);border-top-color:#0F2A3D}
#tt.tt-below::after{bottom:100%;left:var(--ax,50%);transform:translateX(-50%);border-bottom-color:#0F2A3D}
.tip-icon{display:inline-flex;align-items:center;justify-content:center;width:13px;height:13px;border-radius:50%;background:var(--border);color:var(--muted);font-size:8.5px;font-weight:800;margin-left:4px;vertical-align:middle;flex-shrink:0;font-style:normal;cursor:help}
.aud-section{margin-top:22px}
.aud-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
@media(max-width:520px){.aud-grid{grid-template-columns:1fr}}
.aud-block{background:var(--unicef-pale2);border-radius:10px;padding:13px 14px}
.aud-block.full{grid-column:1/-1}
.aud-bt{font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:9px}
.aud-bar-row{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.aud-bar-lbl{font-size:11px;font-weight:600;flex:0 0 88px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text)}
.aud-bar-track{flex:1;height:6px;background:var(--border);border-radius:3px;overflow:hidden}
.aud-bar-fill{height:100%;background:var(--unicef);border-radius:3px}
.aud-bar-pct{font-size:10.5px;font-weight:700;flex:0 0 36px;text-align:right;color:var(--text)}
.aud-gender-bar{height:14px;border-radius:7px;display:flex;overflow:hidden;margin-top:6px}
.aud-gm{background:#374EA2;height:100%}.aud-gf{background:#E2498A;height:100%}
.aud-gl{display:flex;justify-content:space-between;font-size:10px;font-weight:700;margin-top:4px}
.aud-glm{color:#374EA2}.aud-glf{color:#E2498A}
.aud-age-row{display:flex;align-items:center;gap:4px;margin-bottom:3px}
.aud-age-l{font-size:10px;font-weight:600;flex:0 0 40px;color:var(--muted)}
.aud-age-t{flex:1;height:5px;background:var(--border);border-radius:2px;overflow:hidden}
.aud-age-f{height:100%;background:#1CABE2;border-radius:2px}
.aud-age-p{font-size:10px;font-weight:700;flex:0 0 32px;text-align:right;color:var(--text)}
.cats-wrap{display:flex;flex-wrap:wrap;gap:4px;margin-top:2px}
.cat-tag{font-size:10px;font-weight:600;padding:2px 8px;border-radius:20px;background:var(--border);color:var(--text)}
.mp-meta{min-width:0}

function computePrimary(d){
  let best=null;
  for(const p of PLATS){const pl=d[p];if(!pl)continue;
    const hasAny=pl.link||pl.followers!=null||pl.er!=null;if(!hasAny)continue;
    const er=pl.er!=null?pl.er:-1, fol=pl.followers!=null?pl.followers:-1, cand=[er,fol,p];
    if(!best||cand[0]>best[0]||(cand[0]===best[0]&&cand[1]>best[1]))best=cand;}
  return best?best[2]:null;
}
function bestFollowers(d){let m=0;for(const p of PLATS){const pl=d[p];if(pl&&pl.followers)m=Math.max(m,pl.followers);}return m;}
function computeScores(d){
  const plats=['instagram','tiktok','youtube','facebook'];
  // --- Engagement Score (0-100) ---
  const ers=plats.map(p=>d[p]&&d[p].er!=null?d[p].er:null).filter(v=>v!=null);
  const bestEr=ers.length?Math.max(...ers):null;
  const erScore=bestEr!=null?Math.min(100,Math.round(bestEr/6*100)):null;
  const aqsVals=['instagram','tiktok'].map(p=>d[p]&&d[p].aqs!=null?d[p].aqs:null).filter(v=>v!=null);
  const aqsAvg=aqsVals.length?aqsVals.reduce((a,b)=>a+b,0)/aqsVals.length:null;
  d._eng=(erScore!=null&&aqsAvg!=null)?Math.min(100,Math.round(.55*erScore+.45*aqsAvg)):erScore!=null?erScore:aqsAvg!=null?Math.round(aqsAvg):null;
  // --- Risk Score (0-100, lower=safer) ---
  function bsNum(v){if(!v)return 40;const l=v.toLowerCase();if(l.includes('unsafe')||l.includes('high risk'))return 85;if(l.includes('risky')||l.includes('medium'))return 55;return 12;}
  const bsVals=['instagram','youtube'].map(p=>d[p]&&d[p].brand_safety?bsNum(d[p].brand_safety):null).filter(v=>v!=null);
  const bsAvg=bsVals.length?bsVals.reduce((a,b)=>a+b,0)/bsVals.length:40;
  const aqsRisk=aqsAvg!=null?Math.max(0,100-aqsAvg):40;
  d._risk=Math.min(100,Math.round(.6*bsAvg+.4*aqsRisk));
  // --- Partnership Potential Score (0-100) ---
  const maxFol=Math.max(...plats.map(p=>d[p]&&d[p].followers||0));
  const reachScore=maxFol>0?Math.min(100,Math.max(0,Math.round((Math.log10(maxFol)-3)/(7-3)*100))):0;
  const safeBonus=bsVals.length&&bsVals.every(v=>v<=15)?8:0;
  const unicefBonus=d.unicef?7:0;
  const erP=erScore!=null?erScore:50;const aqsP=aqsAvg!=null?Math.round(aqsAvg):50;
  d._partner=Math.min(100,Math.round(.35*reachScore+.32*erP+.33*aqsP)+safeBonus+unicefBonus);
}
DATA.forEach((d,i)=>{d._primary=computePrimary(d);d._best=bestFollowers(d);d._idx=i;computeScores(d);});

function fmt(n){if(n==null)return null;if(n>=1e6)return (n/1e6).toFixed(n>=1e7?0:1).replace(/\.0$/,"")+"M";if(n>=1e3)return Math.round(n/1e3)+"K";return ""+n;}

  const tierColor={Mega:"#3730A3",Macro:"#1D4ED8",Mid:"#0891B2",Micro:"#1CABE2",Nano:"#94A3B8"};
  function opt(key,val,label,dot){
    const active=state[key]===val;
    const ct=countBy(key,val);
    const dotHtml=dot?`<span class="f-dot" style="background:${dot}"></span>`:"";
    return `<div class="f-opt ${active?'active':''}" onclick="setFilter('${key}','${val.replace(/'/g,"\\'")}')"><span class="f-row">${dotHtml}<span class="f-name">${label}</span></span>${val==='All'?'':`<span class="f-ct">${ct}</span>`}</div>`;
  }
  const ucCount=countBy("unicef",true);
  const ucOpt=`<div class="f-opt ${state.unicef?'active':''}" onclick="toggleUnicef()"><span class="f-row"><span class="f-dot" style="background:#1CABE2"></span><span class="f-name">UNICEF-engaged only</span></span><span class="f-ct">${ucCount}</span></div>`;
  document.getElementById("sidebar").innerHTML=`
    <div class="side-block"><div class="side-h">UNICEF Engagement</div>${ucOpt}<div style="font-size:10.5px;color:var(--muted);padding:6px 10px 0;line-height:1.5">KOLs currently or previously engaged by UNICEF Vietnam.</div></div>
    <div class="side-block"><div class="side-h">Tier</div>${opt("tier","All","All tiers")}${tiers.map(t=>opt("tier",t,t,tierColor[t])).join("")}</div>
    <div class="side-block"><div class="side-h">Primary Platform</div>${opt("platform","All","All platforms")}${PLATS.map(p=>opt("platform",p,PLABEL[p],PCOLOR[p])).join("")}</div>
    <div class="side-block"><div class="side-h">Sector</div>${opt("sector","All","All sectors")}${sectors.map(s=>opt("sector",s,s,secColors[s])).join("")}</div>
    <div class="side-block"><button class="reset-btn" onclick="resetFilters()">↺ Reset all filters</button></div>`;
}

function scoreBarHtml(d){
  if(!d.top60)return "";
  function srow(label,val,fillCls,color){
    if(val==null)return "";
    return `<div class="score-row"><span class="score-lbl">${label}</span><div class="score-track"><div class="score-fill ${fillCls}" style="width:${val}%"></div></div><span class="score-val" style="color:${color}">${val}</span></div>`;
  }
  const rCls=d._risk==null?'score-risk-low':d._risk<=33?'score-risk-low':d._risk<=66?'score-risk-mid':'score-risk-hi';
  const rCol=d._risk==null?'#10B981':d._risk<=33?'#10B981':d._risk<=66?'#F59E0B':'#EF4444';
  const rows=[srow('Engagement','score-eng','#374EA2',d._eng),srow('Risk Level',rCls,rCol,d._risk),srow('Partnership','score-partner','#8B5CF6',d._partner)].join('');
  if(!rows)return "";
  // fix: use proper fill classes inline
  const eng=d._eng!=null?`<div class="score-row"><span class="score-lbl" ${tip(TIPS.engScore)}>Engagement${tipIcon('engScore')}</span><div class="score-track"><div class="score-fill score-eng" style="width:${d._eng}%"></div></div><span class="score-val" style="color:#374EA2">${d._eng}</span></div>`:"";
  const risk=d._risk!=null?`<div class="score-row"><span class="score-lbl" ${tip(TIPS.riskScore)}>Risk Level${tipIcon('riskScore')}</span><div class="score-track"><div class="score-fill ${rCls}" style="width:${d._risk}%"></div></div><span class="score-val" style="color:${rCol}">${d._risk}</span></div>`:"";
  const part=d._partner!=null?`<div class="score-row"><span class="score-lbl" ${tip(TIPS.partnerScore)}>Partnership${tipIcon('partnerScore')}</span><div class="score-track"><div class="score-fill score-partner" style="width:${d._partner}%"></div></div><span class="score-val" style="color:#8B5CF6">${d._partner}</span></div>`:"";
  if(!eng&&!risk&&!part)return "";
  return `<div class="card-scores">${eng}${risk}${part}</div>`;
}
function erClass(er){if(er==null)return"er-lo";if(er>=5)return"er-hi";if(er>=2)return"er-mid";return"er-lo";}
function initials(name){const parts=name.trim().split(/\s+/).filter(w=>/[\p{L}]/u.test(w));const a=parts[parts.length-2]||parts[0]||"";const b=parts[parts.length-1]||"";return ((a[0]||"")+(b[0]||"")).toUpperCase();}

function avatarHtml(d){
  const init=initials(d.name);const p=d._primary;
  const cands=[];
  if(d.photo_url)cands.push(d.photo_url);
  const order=[p,"instagram","tiktok","youtube"].filter(Boolean);const seen={};
  for(const pl of order){if(seen[pl])continue;seen[pl]=1;const o=d[pl];
    if(o&&o.username){const u=encodeURIComponent(o.username.replace(/^@/,""));
      if(pl==="instagram")cands.push(`https://unavatar.io/instagram/${u}?fallback=false`);
      else if(pl==="tiktok")cands.push(`https://unavatar.io/tiktok/${u}?fallback=false`);
      else if(pl==="youtube")cands.push(`https://unavatar.io/youtube/${u}?fallback=false`);}}
  const ppIcon=p?`<span class="pp-badge" style="background:${p==='instagram'?'#DD2A7B':PCOLOR[p]}" title="Best-engagement platform: ${PLABEL[p]}"><span style="font-size:8px;color:#fff;font-weight:800">${PSHORT[p]}</span></span>`:"";
  if(cands.length){const chain=JSON.stringify(cands).replace(/"/g,"&quot;");
    return `<div class="avatar"><img src="${cands[0]}" loading="lazy" alt="${d.name}" data-cands="${chain}" data-i="0" onerror="(function(im){var c=JSON.parse(im.getAttribute('data-cands'));var i=+im.getAttribute('data-i')+1;if(i&lt;c.length){im.setAttribute('data-i',i);im.src=c[i];}else{im.style.display='none';im.nextElementSibling.style.display='flex';}})(this)"><span class="initials" style="display:none">${init}</span>${ppIcon}</div>`;}
  return `<div class="avatar"><span class="initials">${init}</span>${ppIcon}</div>`;
}

function platRow(d,p){
  const pl=d[p];if(!pl||(!pl.link&&!pl.followers&&pl.er==null))return "";
  const isPrim=d._primary===p;
  const handle=pl.username?("@"+pl.username.replace(/^@/,"")):PLABEL[p];
  const folHtml=pl.followers!=null?`<span class="plat-fol">${fmt(pl.followers)}</span>`:`<span class="plat-fol" style="color:#c2d6e2">—</span>`;
  const erHtml=pl.er!=null?`<span class="plat-er ${erClass(pl.er)}" ${tip(TIPS.er)}>${pl.er.toFixed(1)}%</span>`:`<span class="plat-er er-lo">·</span>`;
  const open=pl.link?`href="${pl.link}" target="_blank" rel="noopener"`:"";
  return `<a class="plat-row ${isPrim?'is-primary':''}" ${open}><span class="plat-ic ${PCLASS[p]}">${PSHORT[p]}</span><span class="plat-meta"><span class="plat-handle">${handle}</span><span class="plat-sub">${PLABEL[p]}</span></span>${folHtml}${erHtml}</a>`;
}

function card(d){
  const primLink=(d._primary&&d[d._primary]&&d[d._primary].link)||(PLATS.map(p=>d[p]&&d[p].link).find(Boolean));
  const nameHtml=primLink?`<a href="${primLink}" target="_blank" rel="noopener">${d.name}</a>`:d.name;
  const ucTag=d.unicef?`<span class="unicef-tag">★ UNICEF-engaged</span>`:"";
  const t75Tag=(tab!=="top60"&&d.top60)?`<span class="top60-tag">Top 61</span>`:"";
  return `<div class="card ${d.unicef?'is-unicef':''}"><div class="card-head"><div class="card-top">
    ${avatarHtml(d)}
    <div class="card-id"><div class="card-name">${nameHtml}</div>
      <div class="card-badges"><span class="tier-badge tier-${d.tier}" ${tip(TIPS.tier)}>${d.tier}</span><span class="sector-badge">${d.sector}</span>${ucTag}${t75Tag}</div></div>
    </div></div>
    <div class="card-bio">${d.bio||""}</div>
    ${d.top60?scoreBarHtml(d):''}
    <button class="card-more" onclick="openModal(${d._idx})">View Details</button>
    <div class="card-divider"></div>
    <div class="card-plats">${PLATS.map(p=>platRow(d,p)).join("")}</div></div>`;
}

function render(){
  const rows=filtered();
  rows.sort((a,b)=>state.sortMetric==="name"?norm(a.name).localeCompare(norm(b.name)):sortVal(b)-sortVal(a));
  renderCharts(rows);renderSidebar();updateResetBtn();
  document.querySelectorAll(".sortbtn[data-metric]").forEach(b=>b.classList.toggle("active",b.dataset.metric===state.sortMetric));
  document.querySelectorAll(".sortbtn[data-plat]").forEach(b=>b.classList.toggle("active",b.dataset.plat===state.sortPlat));
  document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab));
  const scopeTotal=scope().length;
  document.getElementById("meta").innerHTML=rows.length===scopeTotal?`Showing all <b>${scopeTotal}</b> profiles${tab==='top60'?' in the drilled-down Top 61':''}`:`Showing <b>${rows.length}</b> of <b>${scopeTotal}</b> profiles`;
  document.getElementById("count").textContent=`${rows.length} profiles`;
  const grid=document.getElementById("grid");
  if(!rows.length)grid.innerHTML=`<div class="empty" style="grid-column:1/-1"><h3>No matches</h3><p>Try clearing a filter or searching a different name.</p></div>`;
  else grid.innerHTML=rows.map(card).join("");
}

function setTab(t){tab=t;render();window.scrollTo({top:0,behavior:'smooth'});}
function updateTabCounts(){const ctAll=document.getElementById("ct-all");const ctTop=document.getElementById("ct-top60");if(ctAll)ctAll.textContent=DATA.length;if(ctTop)ctTop.textContent=DATA.filter(d=>d.top60).length;}
function setFilter(key,val){state[key]=val;render();window.scrollTo({top:0,behavior:'smooth'});}
function toggleUnicef(){state.unicef=!state.unicef;render();}
function isFiltered(){return state.q||state.sector!=="All"||state.platform!=="All"||state.tier!=="All"||state.unicef||tab!=="all";}
function updateResetBtn(){const btn=document.getElementById("sortbar-reset");if(btn)btn.classList.toggle("visible",!!isFiltered());}
function resetFilters(){state={q:"",sector:"All",platform:"All",tier:"All",unicef:false,sortMetric:"followers",sortPlat:"best"};tab="all";document.getElementById("search").value="";render();}
function setSort(m){state.sortMetric=m;render();}
function setSortPlat(p){state.sortPlat=p;render();}
// ---- Tooltip definitions (plain English for stakeholders) ----
const TIPS = {
  aqs: "Audience Quality Score — measures how genuine and active an influencer's followers are, out of 100.\n\n80–100: Excellent · 60–79: Good · 40–59: Average · Below 40: Poor\n\nA higher score means fewer fake or inactive accounts.",
  er: "Engagement Rate — the percentage of followers who actively interact with a post (likes, comments, shares).\n\nAbove 5%: High · 2–5%: Good · Below 2%: Low\n\nHigher engagement means the audience is genuinely interested.",
  brandSafety: "Brand Safety — assesses whether an influencer's content is appropriate for an organisation like UNICEF.\n\n✅ Safe: content is suitable for partnership\n⚠️ Risky: some caution advised\n❌ Not Safe: content not recommended for association.",
  engScore: "Engagement Score (0–100) — a composite measure of how actively and genuinely an influencer's audience interacts with their content. Combines engagement rate and audience quality (AQS).",
  riskScore: "Risk Score (0–100) — assesses reputational risk for UNICEF partnership. Lower is better.\n\n0–33: Low risk ✅ · 34–66: Moderate ⚠️ · 67–100: High risk ❌\n\nBased on brand safety ratings and audience authenticity.",
  partnerScore: "Partnership Potential (0–100) — overall suitability for UNICEF collaboration. Combines audience reach, engagement quality, content safety, and whether the influencer has previously worked with UNICEF.",
  tier: "Influencer tier by total follower count across all platforms:\n\nMega: 1M+ · Macro: 500K–1M\nMid: 100K–500K · Micro: 10K–100K\nNano: below 10K",
  followers: "Total number of people following this influencer on this platform.",
};
function tip(text, cls=''){return `data-tip="${text.replace(/"/g,'&quot;').replace(/\n/g,'&#10;')}" ${cls?`class="${cls}"`:''}`;}
function tipIcon(key,cls=''){return `<i class="tip-icon" ${tip(TIPS[key]||key,cls)}>i</i>`;}

function aqsClass(v){if(v==null)return"";if(v>=80)return"aqs-ex";if(v>=60)return"aqs-go";if(v>=40)return"aqs-av";return"aqs-po";}
function aqsLabel(v){if(v==null)return"";if(v>=80)return"Excellent";if(v>=60)return"Good";if(v>=40)return"Average";return"Poor";}
function bsClass(v){if(!v)return"";const l=v.toLowerCase();if(l.includes("unsafe")||l.includes("high risk"))return"bs-unsafe";if(l.includes("risky")||l.includes("medium")||l.includes("moderate"))return"bs-risky";return"bs-safe";}
function bsLabel(v){if(!v)return"";const l=v.toLowerCase();if(l.includes("safe")&&!l.includes("un"))return"Safe";if(l.includes("unsafe"))return"Not Safe";return v.replace(/_/g," ").replace(/\b\w/g,c=>c.toUpperCase());}
function modalPlat(d,p){
  const pl=d[p];if(!pl||(!pl.link&&!pl.followers&&pl.er==null))return "";
  const isPrim=d._primary===p;
  const handle=pl.username?("@"+pl.username.replace(/^@/,"")):PLABEL[p];
  const fol=pl.followers!=null?`<div class="mp-stat"><div class="n">${fmt(pl.followers)}</div><div class="l" ${tip(TIPS.followers)}>Followers</div></div>`:`<div class="mp-stat"><div class="n" style="color:#c2d6e2">—</div><div class="l">Followers</div></div>`;
  const er=pl.er!=null?`<span class="mp-er ${erClass(pl.er)}" ${tip(TIPS.er)}>${pl.er.toFixed(1)}%</span>`:`<span class="mp-er er-lo">·</span>`;
  const open=pl.link?`href="${pl.link}" target="_blank" rel="noopener"`:"";
  const aqsBadge=pl.aqs!=null?`<span class="aqs-badge ${aqsClass(pl.aqs)}" ${tip(TIPS.aqs)}>AQS ${pl.aqs} · ${aqsLabel(pl.aqs)}</span>`:"";
  const bsBadge=pl.brand_safety?`<span class="bs-badge ${bsClass(pl.brand_safety)}" ${tip(TIPS.brandSafety)}>${bsLabel(pl.brand_safety)}</span>`:"";
  const badges=(aqsBadge||bsBadge)?`<div class="mp-badges">${aqsBadge}${bsBadge}</div>`:"";
  return `<a class="modal-plat ${isPrim?'is-primary':''}" ${open}><span class="plat-ic ${PCLASS[p]}">${PSHORT[p]}</span><span class="mp-meta"><div class="mp-handle">${handle}</div><div class="mp-name">${PLABEL[p]}${isPrim?' · best engagement':''}</div>${badges}</span>${fol}${er}</a>`;
}
function qualScoresHtml(d){
  function scoreCard(label,val,fillCls,color,desc){
    if(val==null)return "";
    const pct=val;
    return `<div class="aud-block"><div class="aud-bt">${label}</div>
      <div style="display:flex;align-items:baseline;gap:8px;margin:4px 0 8px">
        <span style="font-size:28px;font-weight:900;color:${color};line-height:1">${val}</span>
        <span style="font-size:10px;color:var(--muted);font-weight:600">/100</span>
      </div>
      <div class="score-track" style="height:8px;border-radius:4px;margin-bottom:8px"><div class="score-fill ${fillCls}" style="width:${pct}%;height:100%"></div></div>
      <div style="font-size:10.5px;color:var(--muted);line-height:1.5">${desc}</div></div>`;
  }
  const riskColor=d._risk==null?'#10B981':d._risk<=33?'#10B981':d._risk<=66?'#F59E0B':'#EF4444';
  const riskCls=d._risk==null?'score-risk-low':d._risk<=33?'score-risk-low':d._risk<=66?'score-risk-mid':'score-risk-hi';
  const riskLabel=d._risk==null?'Low':d._risk<=33?'Low (Safe)':d._risk<=66?'Moderate':'High';
  const engCard=scoreCard('Engagement Score',d._eng,'score-eng','#374EA2',TIPS.engScore);
  const riskCard=scoreCard('Risk Score',d._risk,riskCls,riskColor,`Risk Level: <strong>${riskLabel}</strong>. ${TIPS.riskScore}`);
  const partCard=scoreCard('Partnership Potential',d._partner,'score-partner','#8B5CF6',TIPS.partnerScore);
  if(!engCard&&!riskCard&&!partCard)return "";
  return `<div class="aud-section" style="margin-top:16px"><div class="modal-sec">Quality Scores</div><div class="aud-grid">${engCard}${riskCard}${partCard}</div></div>`;
}
function barRows(items,maxPct){
  if(!items||!items.length)return "";
  const mx=maxPct||Math.max(...items.map(i=>i.pct||0));
  return items.map(item=>`<div class="aud-bar-row"><span class="aud-bar-lbl" title="${item.name}">${item.name}</span><div class="aud-bar-track"><div class="aud-bar-fill" style="width:${mx>0?(item.pct/mx*100).toFixed(1):0}%"></div></div><span class="aud-bar-pct">${item.pct.toFixed(1)}%</span></div>`).join("");
}
function genderBlock(gender,label){
  if(!gender||gender.male==null&&gender.female==null)return "";
  const m=gender.male||0,f=gender.female||0;
  return `<div class="aud-block"><div class="aud-bt">${label} · Gender</div>
    <div class="aud-gender-bar"><div class="aud-gm" style="width:${m}%"></div><div class="aud-gf" style="width:${f}%"></div></div>
    <div class="aud-gl"><span class="aud-glm">♂ ${m.toFixed(1)}%</span><span class="aud-glf">♀ ${f.toFixed(1)}%</span></div></div>`;
}
function ageBlock(age,label){
  if(!age)return "";
  const vals=Object.values(age);const mx=Math.max(...vals);
  return `<div class="aud-block"><div class="aud-bt">${label} · Age</div>${Object.entries(age).map(([l,v])=>`<div class="aud-age-row"><span class="aud-age-l">${l}</span><div class="aud-age-t"><div class="aud-age-f" style="width:${mx>0?(v/mx*100).toFixed(1):0}%"></div></div><span class="aud-age-p">${v.toFixed(1)}%</span></div>`).join("")}</div>`;
}
function audienceSection(d){
  if(!d.top60)return "";
  const blocks=[];
  // categories
  const cats=(d.instagram&&d.instagram.categories)||[];
  if(cats.length) blocks.push(`<div class="aud-block full"><div class="aud-bt">Content Categories</div><div class="cats-wrap">${cats.slice(0,10).map(c=>`<span class="cat-tag">${c}</span>`).join("")}</div></div>`);
  // countries
  const igC=d.instagram&&d.instagram.audience&&d.instagram.audience.countries;
  const ttC=d.tiktok&&d.tiktok.audience&&d.tiktok.audience.countries;
  if(igC) blocks.push(`<div class="aud-block"><div class="aud-bt">IG · Audience Countries</div>${barRows(igC.slice(0,5))}</div>`);
  if(ttC) blocks.push(`<div class="aud-block"><div class="aud-bt">TT · Audience Countries</div>${barRows(ttC.slice(0,5))}</div>`);
  // languages
  const igL=d.instagram&&d.instagram.audience&&d.instagram.audience.languages;
  const ttL=d.tiktok&&d.tiktok.audience&&d.tiktok.audience.languages;
  if(igL) blocks.push(`<div class="aud-block"><div class="aud-bt">IG · Audience Languages</div>${barRows(igL.slice(0,5))}</div>`);
  if(ttL) blocks.push(`<div class="aud-block"><div class="aud-bt">TT · Audience Languages</div>${barRows(ttL.slice(0,5))}</div>`);
  // gender
  const igG=d.instagram&&d.instagram.audience&&d.instagram.audience.gender;
  const ttG=d.tiktok&&d.tiktok.audience&&d.tiktok.audience.gender;
  if(igG) blocks.push(genderBlock(igG,"Instagram"));
  if(ttG) blocks.push(genderBlock(ttG,"TikTok"));
  // age
  const igA=d.instagram&&d.instagram.audience&&d.instagram.audience.age;
  const ttA=d.tiktok&&d.tiktok.audience&&d.tiktok.audience.age;
  if(igA) blocks.push(ageBlock(igA,"Instagram"));
  if(ttA) blocks.push(ageBlock(ttA,"TikTok"));
  if(!blocks.length)return "";
  return `<div class="aud-section"><div class="modal-sec">Audience Insights <i class="tip-icon" ${tip("Data about who follows this influencer — where they are, what language they speak, their gender and age breakdown. Sourced from HypeAuditor.")}>i</i></div><div class="aud-grid">${blocks.join("")}</div></div>`;
}
function openModal(idx){
  const d=DATA[idx];if(!d)return;
  const av=avatarHtml(d).replace('class="avatar"','class="modal-avatar"');
  const ucB=d.unicef?`<span class="b" style="background:rgba(255,255,255,.35)">★ UNICEF-engaged</span>`:"";
  const t60B=d.top60?`<span class="b">Top 61</span>`:"";
  const html=`<div class="modal" onclick="event.stopPropagation()">
    <div class="modal-head ${d.unicef?'':'plain'}">
      ${av}
      <div class="modal-hid"><div class="modal-name">${d.name}</div>
        <div class="modal-badges"><span class="b" ${tip(TIPS.tier)}>${d.tier}</span><span class="b">${d.sector}</span>${ucB}${t60B}</div></div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="modal-sec">Profile</div>
      <div class="modal-bio">${d.bio||"No description available."}</div>
      ${d.top60?qualScoresHtml(d):''}
      <div class="modal-sec">Platforms &amp; Metrics</div>
      <div class="modal-plats">${PLATS.map(p=>modalPlat(d,p)).join("")}</div>
      ${audienceSection(d)}
    </div></div>`;
  const ov=document.getElementById("modal");
  ov.innerHTML=html;ov.classList.add("open");
}
function closeModal(){const ov=document.getElementById("modal");ov.classList.remove("open");ov.innerHTML="";}
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal();});

document.getElementById("search").addEventListener("input",e=>{state.q=e.target.value;render();});
updateTabCounts();
render();

// ---- Tooltip engine (body-level, never clipped) ----
(function(){
  const tt=document.getElementById("tt");
  let hideTimer;
  function show(el){
    clearTimeout(hideTimer);
    const text=el.getAttribute("data-tip");
    if(!text)return;
    tt.textContent=text.replace(/&#10;/g,'\n');
    tt.classList.add("show");
    const r=el.getBoundingClientRect();
    const tw=240,th=tt.offsetHeight||80;
    const vw=window.innerWidth,vh=window.innerHeight;
    // Prefer above; fall back to below
    const spaceAbove=r.top,spaceBelow=vh-r.bottom;
    const above=spaceAbove>=th+14||spaceAbove>=spaceBelow;
    tt.classList.toggle("tt-above",above);
    tt.classList.toggle("tt-below",!above);
    // Horizontal: centre on element, clamp to viewport
    let left=r.left+r.width/2-tw/2;
    left=Math.max(8,Math.min(left,vw-tw-8));
    const top=above?r.top-th-12:r.bottom+10;
    tt.style.left=left+"px";
    tt.style.top=top+"px";
    tt.style.width=tw+"px";
    // Arrow offset relative to tooltip box
    const arrowLeft=Math.min(Math.max(r.left+r.width/2-left,14),tw-14);
    tt.style.setProperty("--ax",arrowLeft+"px");
  }
  function hide(){hideTimer=setTimeout(()=>tt.classList.remove("show"),80);}
  document.addEventListener("mouseover",e=>{
    const el=e.target.closest("[data-tip]");
    if(el)show(el);else hide();
  });
  document.addEventListener("mouseout",e=>{
    if(!e.relatedTarget||!e.relatedTarget.closest("[data-tip]"))hide();
  });
  document.addEventListener("scroll",hide,true);
  document.addEventListener("click",hide,true);
})();
