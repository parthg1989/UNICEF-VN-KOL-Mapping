<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UNICEF Vietnam · KOL Directory &amp; Analytics</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@700;800&display=swap" rel="stylesheet">
<style>*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --unicef:#1CABE2;--unicef-dark:#0C7DAE;--unicef-deep:#005780;--unicef-pale:#E3F4FB;--unicef-pale2:#F2FAFD;
  --navy:#374EA2;--ink:#0F2A3D;--bg:#EAF4FA;--card:#fff;
  --text:#13303F;--muted:#5C7689;--border:#D4E6F0;--fb:#1877F2;--tt:#111;--ig:#E1306C;--yt:#FF0000;
  --radius:14px;--shadow:0 1px 3px rgba(12,125,174,.07),0 10px 28px rgba(12,125,174,.08);
  --sidebar-w:290px;
}
html,body{min-height:100%}
body{font-family:"Inter",system-ui,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}

/* Header */
.header{background:#fff;padding:14px 26px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:200;box-shadow:0 2px 14px rgba(12,125,174,.12);border-bottom:3px solid var(--unicef)}
.h-logo{height:38px;width:auto;display:block}
.h-divider{width:1px;height:34px;background:var(--border)}
.h-title{color:var(--unicef-deep);font-size:16px;font-weight:800;letter-spacing:-.2px;line-height:1.2}
.h-sub{color:var(--muted);font-size:11px;margin-top:2px;font-weight:500}
.h-count{margin-left:auto;background:var(--unicef);color:#fff;font-size:12.5px;font-weight:700;padding:7px 16px;border-radius:30px;white-space:nowrap;box-shadow:0 2px 8px rgba(28,171,226,.3)}

/* Sort bar */
.sortbar{background:#fff;border-bottom:1px solid var(--border);padding:10px 26px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;position:sticky;top:69px;z-index:150}
.searchwrap{position:relative;flex:1;min-width:200px;max-width:340px}
.searchwrap input{width:100%;padding:9px 13px 9px 36px;border:1.5px solid var(--border);border-radius:9px;font-size:13px;font-family:inherit;outline:none;background:var(--unicef-pale2);color:var(--text);transition:.15s}
.searchwrap input:focus{border-color:var(--unicef);background:#fff;box-shadow:0 0 0 3px rgba(28,171,226,.15)}
.searchwrap svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--unicef);width:15px;height:15px}
.sortgroup{display:flex;align-items:center;gap:0;margin-left:auto;border:1.5px solid var(--border);border-radius:10px;overflow:hidden;background:var(--unicef-pale2);flex-wrap:wrap}
.sortlabel{font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);padding:0 12px;align-self:center}
.sortbtn{padding:8px 12px;background:transparent;border:none;border-left:1px solid var(--border);font-size:11.5px;font-weight:700;font-family:inherit;cursor:pointer;color:var(--muted);transition:.13s;white-space:nowrap}
.sortbtn.active{background:var(--unicef);color:#fff}
.sortbtn:hover:not(.active){background:var(--unicef-pale);color:var(--unicef-deep)}
.platgroup{display:flex;border-left:2px solid var(--border)}
.platgroup .sortbtn:first-child{border-left:none}

/* Layout */
.layout{display:flex;align-items:flex-start;gap:0}
.sidebar{width:var(--sidebar-w);flex-shrink:0;position:sticky;top:124px;height:calc(100vh - 124px);overflow-y:auto;padding:20px 18px 40px;border-right:1px solid var(--border);background:#fff}
.sidebar::-webkit-scrollbar{width:7px}.sidebar::-webkit-scrollbar-thumb{background:#bcdcec;border-radius:4px}
.main{flex:1;min-width:0;padding:20px 26px 60px}

/* Sidebar filters */
.side-h{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.7px;color:var(--unicef-deep);margin:0 0 10px;display:flex;align-items:center;gap:7px}
.side-block{margin-bottom:24px}
.side-block:last-child{margin-bottom:0}
.f-opt{display:flex;align-items:center;justify-content:space-between;padding:7px 10px;border-radius:8px;font-size:12.5px;font-weight:500;color:var(--text);cursor:pointer;transition:.12s;border:1px solid transparent}
.f-opt:hover{background:var(--unicef-pale)}
.f-opt.active{background:var(--unicef);color:#fff;font-weight:700}
.f-opt.active .f-ct{background:rgba(255,255,255,.28);color:#fff}
.f-ct{font-size:10.5px;font-weight:700;color:var(--muted);background:var(--unicef-pale);padding:1px 8px;border-radius:20px;min-width:26px;text-align:center}
.f-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;margin-right:8px}
.f-row{display:flex;align-items:center;flex:1;min-width:0}
.f-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.reset-btn{width:100%;padding:9px;margin-top:4px;border:1.5px solid var(--border);background:#fff;border-radius:9px;font-size:12px;font-weight:700;font-family:inherit;color:var(--muted);cursor:pointer;transition:.13s}
.reset-btn:hover{border-color:var(--unicef);color:var(--unicef-deep);background:var(--unicef-pale2)}

/* Charts */
.charts{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:16px;margin-bottom:22px}
.chart-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px}
.chart-title{font-size:12px;font-weight:800;color:var(--unicef-deep);text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px}
.chart-sub{font-size:11px;color:var(--muted);margin-bottom:14px}
.donut-wrap{display:flex;align-items:center;gap:20px}
.donut{flex-shrink:0}
.donut-center{font-size:22px;font-weight:800;fill:var(--unicef-deep)}
.donut-center-sub{font-size:8px;font-weight:700;fill:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.legend{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0;max-height:170px;overflow-y:auto;padding-right:4px}
.legend::-webkit-scrollbar{width:5px}.legend::-webkit-scrollbar-thumb{background:#bcdcec;border-radius:3px}
.leg-item{display:flex;align-items:center;gap:8px;font-size:11.5px;cursor:pointer;padding:2px 4px;border-radius:5px;transition:.1s}
.leg-item:hover{background:var(--unicef-pale)}
.leg-dot{width:10px;height:10px;border-radius:3px;flex-shrink:0}
.leg-name{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text);font-weight:500}
.leg-val{font-weight:800;color:var(--unicef-deep);font-size:11.5px}
.leg-pct{color:var(--muted);font-size:10px;min-width:34px;text-align:right;font-weight:600}
.hbars{display:flex;flex-direction:column;gap:13px;padding-top:6px}
.hbar-row{display:flex;flex-direction:column;gap:5px;cursor:pointer}
.hbar-row:hover .hbar-label{color:var(--unicef-deep)}
.hbar-top{display:flex;align-items:center;justify-content:space-between;font-size:11.5px}
.hbar-label{display:flex;align-items:center;gap:8px;font-weight:600;transition:.1s}
.hbar-icon{width:18px;height:18px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:9px;color:#fff;font-weight:800}
.hbar-val{font-weight:800;color:var(--unicef-deep)}
.hbar-track{height:10px;background:var(--unicef-pale);border-radius:6px;overflow:hidden}
.hbar-fill{height:100%;border-radius:6px;transition:width .5s cubic-bezier(.4,0,.2,1)}

/* Meta */
.meta{font-size:12.5px;color:var(--muted);margin-bottom:14px;font-weight:500}
.meta b{color:var(--unicef-deep);font-weight:800}

/* Cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px}
.card{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--border);overflow:hidden;display:flex;flex-direction:column;transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-3px);box-shadow:0 12px 32px rgba(12,125,174,.16)}
.card-head{padding:16px 16px 0}
.card-top{display:flex;gap:13px;align-items:flex-start;margin-bottom:11px}
.avatar{width:54px;height:54px;border-radius:13px;flex-shrink:0;position:relative;overflow:hidden;background:linear-gradient(135deg,var(--unicef),var(--unicef-deep));display:flex;align-items:center;justify-content:center}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.avatar .initials{font-family:"Sora",sans-serif;font-weight:800;font-size:18px;color:#fff;letter-spacing:-1px}
.avatar .pp-badge{position:absolute;bottom:-2px;right:-2px;width:20px;height:20px;border-radius:50%;border:2.5px solid #fff;display:flex;align-items:center;justify-content:center}
.card-id{flex:1;min-width:0}
.card-name{font-size:15px;font-weight:800;color:var(--text);letter-spacing:-.3px;line-height:1.25}
.card-name a{color:inherit;text-decoration:none}
.card-name a:hover{color:var(--unicef-deep)}
.card-badges{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.tier-badge{font-size:9px;font-weight:800;padding:3px 8px;border-radius:20px;letter-spacing:.3px;text-transform:uppercase}
.tier-Mega{background:#E0E7FF;color:#3730A3}.tier-Macro{background:#DBEAFE;color:#1E40AF}
.tier-Mid{background:#CFFAFE;color:#155E75}.tier-Micro{background:#E3F4FB;color:#0C7DAE}
.tier-Nano{background:#EEF2F6;color:#475569}
.sector-badge{font-size:9px;font-weight:700;padding:3px 8px;border-radius:20px;background:var(--unicef-pale);color:var(--unicef-deep)}
.card-bio{font-size:12px;color:var(--muted);line-height:1.55;margin:0 16px 13px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card-divider{height:1px;background:var(--border)}
.card-plats{padding:11px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.plat-row{display:grid;grid-template-columns:22px 1fr auto auto;align-items:center;gap:9px;padding:8px 10px;border-radius:8px;background:var(--unicef-pale2);font-size:12px;text-decoration:none;color:inherit;transition:.12s;border:1px solid transparent}
.plat-row:hover{background:var(--unicef-pale);border-color:#bce0f0}
.plat-row.is-primary{background:var(--unicef-pale);border-color:var(--unicef);box-shadow:inset 3px 0 0 var(--unicef)}
.plat-ic{width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:#fff}
.plat-ic.tt{background:var(--tt)}.plat-ic.ig{background:linear-gradient(135deg,#F58529,#DD2A7B,#8134AF)}
.plat-ic.yt{background:var(--yt)}.plat-ic.fb{background:var(--fb)}
.plat-meta{min-width:0}
.plat-handle{font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11.5px}
.plat-sub{font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;font-weight:700}
.plat-fol{font-weight:800;color:var(--unicef-deep);font-size:12.5px;text-align:right;white-space:nowrap}
.plat-er{font-size:10px;font-weight:700;text-align:right;white-space:nowrap;padding:2px 6px;border-radius:5px}
.er-hi{background:#CFFAFE;color:#155E75}.er-mid{background:#E3F4FB;color:#0C7DAE}.er-lo{background:#EEF2F6;color:#64748B}
.empty{text-align:center;padding:80px 20px;color:var(--muted)}
.empty h3{font-size:17px;color:var(--text);margin-bottom:6px}

@media(max-width:1100px){.charts{grid-template-columns:1fr}.sidebar{position:static;height:auto;width:250px}}
@media(max-width:820px){.layout{flex-direction:column}.sidebar{width:100%;position:static;height:auto;border-right:none;border-bottom:1px solid var(--border)}}

/* Tabs */
.tabs{display:flex;gap:0;background:#fff;padding:0 26px;border-bottom:1px solid var(--border);position:sticky;top:69px;z-index:151}
.tab{padding:13px 22px;background:none;border:none;border-bottom:3px solid transparent;font-family:inherit;font-size:13.5px;font-weight:700;color:var(--muted);cursor:pointer;transition:.14s;display:flex;align-items:center;gap:9px;margin-bottom:-1px}
.tab:hover{color:var(--unicef-deep)}
.tab.active{color:var(--unicef-deep);border-bottom-color:var(--unicef)}
.tab .tab-ct{font-size:11px;font-weight:800;background:var(--unicef-pale);color:var(--unicef-deep);padding:2px 9px;border-radius:20px}
.tab.active .tab-ct{background:var(--unicef);color:#fff}
/* when tabs present, sortbar sits below them */
.has-tabs .sortbar{top:118px}
.has-tabs .sidebar{top:173px;height:calc(100vh - 173px)}

/* UNICEF contracted tag + ribbon */
.unicef-tag{font-size:8.5px;font-weight:800;padding:3px 8px;border-radius:20px;letter-spacing:.3px;text-transform:uppercase;background:var(--unicef);color:#fff;display:inline-flex;align-items:center;gap:4px}
.card.is-unicef{border-color:var(--unicef);box-shadow:0 0 0 1.5px var(--unicef),var(--shadow)}
.card.is-unicef .card-head{background:linear-gradient(180deg,var(--unicef-pale2),#fff)}
.top60-tag{font-size:8.5px;font-weight:800;padding:3px 8px;border-radius:20px;letter-spacing:.3px;text-transform:uppercase;background:#3730A3;color:#fff}

/* View-details control */
.card-more{display:flex;align-items:center;justify-content:center;gap:6px;margin:0 14px 12px;padding:8px;border:1px solid var(--border);border-radius:9px;background:#fff;font-size:11.5px;font-weight:700;font-family:inherit;color:var(--unicef-deep);cursor:pointer;transition:.13s}
.card-more:hover{background:var(--unicef-pale);border-color:var(--unicef)}
.card-scores{margin:0 14px 12px;display:flex;flex-direction:column;gap:5px}
.score-row{display:flex;align-items:center;gap:8px}
.score-lbl{font-size:9.5px;font-weight:700;flex:0 0 110px;color:var(--muted);text-transform:uppercase;letter-spacing:.3px}
.score-track{flex:1;height:6px;background:var(--border);border-radius:3px;overflow:hidden}
.score-fill{height:100%;border-radius:3px;transition:width .4s}
.score-val{font-size:10.5px;font-weight:800;flex:0 0 28px;text-align:right}
.score-eng{background:linear-gradient(90deg,#1CABE2,#374EA2)}
.score-risk-low{background:linear-gradient(90deg,#10B981,#059669)}
.score-risk-mid{background:linear-gradient(90deg,#F59E0B,#D97706)}
.score-risk-hi{background:linear-gradient(90deg,#EF4444,#DC2626)}
.score-partner{background:linear-gradient(90deg,#8B5CF6,#6D28D9)}
.sortbar-reset{font-size:11px;font-weight:700;font-family:inherit;padding:6px 12px;border:1.5px solid var(--border);border-radius:8px;background:#fff;color:var(--muted);cursor:pointer;transition:.13s;white-space:nowrap;display:none}
.sortbar-reset.visible{display:block}
.sortbar-reset:hover{border-color:var(--unicef);color:var(--unicef-deep);background:var(--unicef-pale2)}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(15,42,61,.55);backdrop-filter:blur(3px);z-index:500;display:none;align-items:flex-start;justify-content:center;padding:40px 20px;overflow-y:auto}
.modal-overlay.open{display:flex}
.modal{background:#fff;border-radius:18px;max-width:600px;width:100%;box-shadow:0 24px 60px rgba(15,42,61,.35);overflow:hidden;animation:pop .18s ease}
@keyframes pop{from{transform:translateY(12px) scale(.98);opacity:0}to{transform:none;opacity:1}}
.modal-head{padding:22px 24px;background:linear-gradient(135deg,var(--unicef),var(--unicef-deep));color:#fff;display:flex;gap:16px;align-items:flex-start;position:relative}
.modal-head.plain{background:linear-gradient(135deg,#5C7689,#374EA2)}
.modal-avatar{width:66px;height:66px;border-radius:15px;flex-shrink:0;overflow:hidden;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;border:2px solid rgba(255,255,255,.5)}
.modal-avatar img{width:100%;height:100%;object-fit:cover}
.modal-avatar .initials{font-family:"Sora",sans-serif;font-weight:800;font-size:22px;color:#fff}
.modal-hid{flex:1;min-width:0}
.modal-name{font-size:20px;font-weight:800;letter-spacing:-.3px;line-height:1.2}
.modal-badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.modal-badges .b{font-size:9.5px;font-weight:800;padding:3px 9px;border-radius:20px;text-transform:uppercase;letter-spacing:.3px;background:rgba(255,255,255,.22);color:#fff}
.modal-close{position:absolute;top:14px;right:16px;width:30px;height:30px;border-radius:50%;border:none;background:rgba(255,255,255,.2);color:#fff;font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.13s}
.modal-close:hover{background:rgba(255,255,255,.35)}
.modal-body{padding:22px 24px}
.modal-sec{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:0 0 8px}
.modal-bio{font-size:13.5px;line-height:1.65;color:var(--text);margin-bottom:20px;white-space:pre-wrap}
.modal-plats{display:flex;flex-direction:column;gap:8px}
.modal-plat{display:grid;grid-template-columns:26px 1fr auto auto;gap:12px;align-items:center;padding:11px 13px;border-radius:10px;background:var(--unicef-pale2);text-decoration:none;color:inherit;border:1px solid transparent;transition:.12s}
.modal-plat:hover{background:var(--unicef-pale);border-color:#bce0f0}
.modal-plat.is-primary{background:var(--unicef-pale);border-color:var(--unicef);box-shadow:inset 3px 0 0 var(--unicef)}
.modal-plat .plat-ic{width:26px;height:26px;border-radius:7px;font-size:11px}
.mp-badges{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
.aqs-badge,.bs-badge{font-size:9.5px;font-weight:800;padding:2px 7px;border-radius:20px;letter-spacing:.2px;white-space:nowrap}
.aqs-ex{background:#D1FAE5;color:#065F46}.aqs-go{background:#DBEAFE;color:#1E40AF}.aqs-av{background:#FEF3C7;color:#92400E}.aqs-po{background:#FEE2E2;color:#991B1B}
.bs-safe{background:#D1FAE5;color:#065F46}.bs-risky{background:#FEF3C7;color:#92400E}.bs-unsafe{background:#FEE2E2;color:#991B1B}
/* ---- Tooltips (rendered into body via JS, never clipped) ---- */
[data-tip]{cursor:help}
#tt{position:fixed;z-index:9999;background:#0F2A3D;color:#fff;font-size:12px;font-weight:400;line-height:1.6;padding:10px 13px;border-radius:10px;max-width:240px;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.35);font-family:inherit;text-align:left;letter-spacing:0;white-space:pre-wrap;display:none;transition:opacity .12s}
#tt.show{display:block}
#tt::after{content:'';position:absolute;border:5px solid transparent}
#tt.tt-above::after{top:100%;left:var(--ax,50%);transform:translateX(-50%);border-top-color:#0F2A3D}
#tt.tt-below::after{bottom:100%;left:var(--ax,50%);transform:translateX(-50%);border-bottom-color:#0F2A3D}
.tip-icon{display:inline-flex;align-items:center;justify-content:center;width:13px;height:13px;border-radius:50%;background:var(--border);color:var(--muted);font-size:8.5px;font-weight:800;margin-left:4px;vertical-align:middle;flex-shrink:0;font-style:normal;cursor:help}
.aud-section{margin-top:22px}
.aud-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
@media(max-width:520px){.aud-grid{grid-template-columns:1fr}}
.aud-block{background:var(--unicef-pale2);border-radius:10px;padding:13px 14px}
.aud-block.full{grid-column:1/-1}
.aud-bt{font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:9px}
.aud-bar-row{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.aud-bar-lbl{font-size:11px;font-weight:600;flex:0 0 88px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text)}
.aud-bar-track{flex:1;height:6px;background:var(--border);border-radius:3px;overflow:hidden}
.aud-bar-fill{height:100%;background:var(--unicef);border-radius:3px}
.aud-bar-pct{font-size:10.5px;font-weight:700;flex:0 0 36px;text-align:right;color:var(--text)}
.aud-gender-bar{height:14px;border-radius:7px;display:flex;overflow:hidden;margin-top:6px}
.aud-gm{background:#374EA2;height:100%}.aud-gf{background:#E2498A;height:100%}
.aud-gl{display:flex;justify-content:space-between;font-size:10px;font-weight:700;margin-top:4px}
.aud-glm{color:#374EA2}.aud-glf{color:#E2498A}
.aud-age-row{display:flex;align-items:center;gap:4px;margin-bottom:3px}
.aud-age-l{font-size:10px;font-weight:600;flex:0 0 40px;color:var(--muted)}
.aud-age-t{flex:1;height:5px;background:var(--border);border-radius:2px;overflow:hidden}
.aud-age-f{height:100%;background:#1CABE2;border-radius:2px}
.aud-age-p{font-size:10px;font-weight:700;flex:0 0 32px;text-align:right;color:var(--text)}
.cats-wrap{display:flex;flex-wrap:wrap;gap:4px;margin-top:2px}
.cat-tag{font-size:10px;font-weight:600;padding:2px 8px;border-radius:20px;background:var(--border);color:var(--text)}
.mp-meta{min-width:0}

.modal-bio-sub{font-size:13px;color:var(--text);margin-bottom:4px}
.modal-themes{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
.theme-tag{background:#E0F2FE;color:#0369A1;border-radius:20px;padding:3px 10px;font-size:11px;font-weight:600}

nam. Hà Lệ Diễm brings a powerful, authentic voice to marginalized rural communities, possessing the unique creative ability to capture global attention and drive public empathy around the rights and protection of ethnic minority children.",advocacy:"Filmmaking Advocacy for Minority & Gender Issues (Children of the Mist): Directed the internationally acclaimed documentary highlighting systemic issues around early marriage, girls' rights, education, gender inequality, and ethnic minority power dynamics in northern Vietnam, serving as a critical resource for global socio-academic advocacy.",relevantLinks:"https://doi.org/10.59236/emro.v26i7a8256",themes:"Ending Violence Against Women & Children, Girl's Education & STEAM, Child Poverty",primary:"facebook"},{name:"marzuz",tier:"Mid",sector:"Music & Arts",unicef:false,top60:false,type:"Celebrities & KOLs",instagram:{followers:66205,er:4.9,link:"https://www.instagram.com/marzuzisntreal",username:"marzuzisntreal",avgReels:66831},tiktok:{followers:58000,er:5.39,link:"https://www.tiktok.com/@marzuzisntreal",username:"marzuzisntreal",avgViews:91700},youtube:{followers:25800,er:1.23,link:"https://www.youtube.com/channel/UCML3RIvX4zWLHIYxs_Dcc_g",username:"UCML3RIvX4zWLHIYxs_Dcc_g",avgViews:110800},facebook:{followers:129698,link:"https://www.facebook.com/marzuzisntreal",avgViews:0,username:"marzuzisntreal"},bio:"Marzuz (Trần My Anh) is one of Vietnam's most distinctive Gen Z indie singer-songwriters, known for her introspective lyrics, folk-inspired vocals, and genre-blending sound. Born in Hanoi in 2000, she began writing songs at the age of 12 and gained recognition through SoundCloud and YouTube. Her music explores themes of identity, mental health, love, and personal growth, earning her a strong connection with young audiences and establishing her as one of Vietnam's most promising independent artists.\n\nWhy Selected\nAuthentic and relatable voice, encouraging self-expression, individuality, and emotional honesty.\nStrong ademy at NASA and awarded the Fulbright Teaching Excellence Award (2022) for innovative leadership in science and technology education in Vietnam.\n\nPower of Radiance Award 2023: Won a $100,000 international grant for her pioneer service-learning STEM projects, dedicated to expanding educational access and scientific literacy for underprivileged girls in rural areas.\n\nUNICEF & Global Youth Grantee (Google, NatGeo, YSEALI): Led community initiatives on digital safety (\"Be Internet Awesome\"), environmental education (YSEALI Mangrove Conservation), pandemic literacy, and direct educational advocacy in collaboration with UNICEF Vietnam.",relevantLinks:"https://vietnamnet.vn/co-giao-nguoi-viet-dau-tien-gianh-giai-thuong-100-000-usd-ve-giao-duc-stem-2118948.html \n\nhttps://www.unicef.org/vietnam/vi/nhung-cau-chuyen/dao-thi-hong-quyen-suc-manh-cua-truyen-tai-dam-me",themes:"Girl's Education & STEAM, Digital Education & Skills, Child Online Safety, Climate Change & Environmental Sustainability",primary:"facebook"},{name:"Mer",tier:"Mid",sector:"Music & Arts",unicef:false,top60:false,type:"Celebrities & KOLs",instagram:{followers:7905,er:5.32,link:"https://www.instagram.com/emmer.nhac",username:"emmer.nhac",avgReels:5044},tiktok:{followers:124100,er:8.69,link:"https://www.tiktok.com/@nhacmer",username:"nhacmer",avgViews:19500},youtube:{followers:104500,er:1.74,link:"https://www.youtube.com/@nhacmer",username:"nhacmer",avgViews:55500},facebook:{followers:60000,link:"https://www.facebook.com/anmongmer",avgViews:0,username:"anmongmer"},bio:"Mer (Trần Thị Thúy An) is a Vietnamese indie singer-songwriter known for her gentle vocals, acoustic sound, and emotionally expressive music. Her songs explore themes of self-discovery, healing, and personal growth, resonating with young audiences through their authenticity and emotional depth.\n\nWhy Selected\nPromotes mental well-being, self-expression, and emotional resilience through music, aligning with UNICEF's youth well-being priorities.\nStrong connection with young audiences through authentic and uplifting storytelling.\nMaintains a positive, approachable, and socially responsible public image.",advocacy:"2026– Soul Sáng Communications Ambassador: Supports a music initiative connecting children, pupils, and university students through creative and educational activities.\n\n2024 – Show It NOW Environmental Art Exhibition: Performed at an event promoting environmental awareness and climate action through art and music.\n\nOngoing – Music for Well-being: Uses her music to promote emotional healing, inner peace, and positive mental well-being through heartfelt acoustic performances.",relevantLinks:"https://www.facebook.com/nvhsvtphcm/posts/-soul-s%C3%A1ng-d%C3%A0n-ngh%E1%BB%87-s%C4%A9-%C4%91%E1%BB%93ng-h%C3%A0nh-c%C3%B9ng-h%C3%A0nh-tr%C3%ACnh-lan-t%E1%BB%8Fa-y%C3%AAu-th%C6%B0%C6%A1ng-%C3%A2m-nh%E1%BA%A1c-kh%C3%B4n/1423343263151970/\n\nhttps://www.facebook.com/watch/?v=801652311706978",themes:"Youth Participation",primary:"tiktok"},{name:"TS. Lê Nguyên Phương",tier:"Micro",sector:"Health & Wellness",unicef:false,top60:false,type:"Field Experts",instagram:null,tiktok:null,youtube:null,facebook:{followers:63000,link:"https://www.facebook.com/dr.phuongnguyenle",avgViews:0,username:"dr.phuongnguyenle"},bio:"TS. Lê Nguyên Phương is an internationally recognized educational psychologist, author, and former U.S. Fulbright Specialist with over two decades of clinical experience in school psychology. He is widely credited with establishing the professional and academic foundations of school counseling and youth mental health support across Vietnam.With decades of academic leadership, institutional policy influence, and public credibility, TS. Lê Nguyên Phương provides high-level expert authority capable of advising national policy frameworks and shaping public understanding of youth mental health.",advocacy:"Academic research: GAP ANALYSIS OF VIETNAMESE STUDENT COUNSELORS’ KNOWLEDGE COMPETENCIES \n\nPioneering School Psychology in Vietnam (CASP-I & Policy Advocacy): Co-founded and led the Consortium to Advance School Psychology – International (CASP-I), successfully campaigning for MOET Circular 31/2017 to establish formal school counseling frameworks and graduate psychology programs in top Vietnamese universities.\n\nUNICEF Collaboration & Academic Research: Coordinated UNICEF Vietnam’s 2004 \"School Counseling Center Construction\" project and published foundational academic gap analyses evaluating the core professional competencies of Vietnamese student counselors.\n\nGlobal Recognition & Bestselling Author: Received the 2011 ISPA Outstanding International School Psychology Practice Award, served as a U.S. State Department Fulbright Specialist (2014–2019), and authored the award-winning parenting book series Dạy con trong hoang mang.",relevantLinks:"https://digitallibrary.usc.edu/CS.aspx?VP3=DamView&VBID=2A3BXZ6SSNUBF&PN=1&DocRID=2A3BF1U1AYUB \n\nhttps://dantri.com.vn/giao-duc/nhung-buoc-di-dau-tien-cua-nganh-tam-ly-hoc-duong-tai-viet-nam-1296213902.htm \n\nhttps://hnue.edu.vn/tin-tuc/4709?page=157 \n\nhttps://scov.gov.vn/dong-bao-vnon/guong-mat/tien-si-goc-viet-no-luc-phat-trien-nganh-tam-ly-hoc-duong-o-viet-nam.html \n\nhttps://drive.google.com/file/d/14WsApwIvXyk2M19I6-0dXGQ1Ck5wLLQM/view?usp=sharing",themes:"Mental Health & Wellbeing, Positive Parenting",primary:"facebook"},{name:"Koka Khoa",tier:"Micro",sector:"Sports Personalities",unicef:false,top60:true,type:"Field Experts",instagram:{followers:36837,er:5.35,link:"https://www.instagram.com/KokaKhoa",username:"KokaKhoa",avgReels:6766},tiktok:{followers:54200,er:5.26,link:"https://www.tiktok.com/@kokakhoa",username:"kokakhoa",avgViews:8800,aqs:49,audience:{countries:[{name:"Vietnam",pct:82.78},{name:"United States (USA)",pct:9.54},{name:"Canada",pct:1.49},{name:"Philippines",pct:0.87},{name:"Australia",pct:0.74}],languages:[{name:"Vietnamese",pct:75.04},{name:"English",pct:23.5},{name:"Indonesian",pct:0.51},{name:"German",pct:0.34},{name:"Spanish",pct:0.09}],gender:{male:53.33,female:46.66},age:{"13-17":13.33,"18-24":26.44,"25-34":45.55,"35-44":13.34,"45-54":1.11,"55-64":0.22}}},youtube:{followers:4300,er:2.86,link:"https://www.youtube.com/@KokaKhoa",username:"KokaKhoa",avgViews:1400},facebook:{followers:27071,link:"https://www.facebook.com/KokaKhoa",avgViews:0,username:"KokaKhoa"},bio:"He is a Vietnamese-American professional basketball player, sports personality, and athletic icon in Vietnam. Over his career with major teams such as Saigon Heat, Danang Dragons, and Ho Chi Minh City Wings, he won the VBA Rising Star award (2016), a VBA Championship with Saigon Heat (2022), and a historic bronze medal with the Vietnam National Basketball Team at the 2019 SEA Games (3x3 category), becoming one of the most prominent faces of youth sports culture in Vietnam. As a high-profile professional athlete and youth sports icon, Koka Khoa brings immense personal influence among young people, using his platform to promote physical literacy, teamwork, and active healthy lifestyles in schools.",advocacy:"2018: Supported hands-on training for teachers nationally to build structured basketball programs through the national project \"Development of School Basketball toward 2030\", co-organized by Ministry of Education and Training, Vietnam Basketball Federation, Junior National Basketball Association, in partnership with UNICEF.",relevantLinks:"https://htv.vn/doanhnhansaigon/de-an-phat-trien-bong-ro-hoc-duong-den-nam-2030-225239.html \n\nhttps://www.facebook.com/share/p/1JjBFVJHY7/",themes:"",primary:"tiktok"},{name:"Bác sĩ Phạm Minh Triết",tier:"Micro",sector:"Health & Wellness",unicef:false,top60:false,type:"Field Experts",instagram:null,tiktok:null,youtube:null,facebook:{followers:14141,link:"https://www.facebook.com/bsphamminhtriet",avgViews:0,username:"bsphamminhtriet"},bio:"Dr. Phạm Minh Triết is a leading Vietnamese expert in pediatric clinical psychology and child mental health. The former Head of the Psychology Department at Children's Hospital 1 (2011–2018), he currently serves as a professional clinical advisor and researcher specializing in evidence-based parent training and developmental interventions. Through his clinical leadership, pioneer research on online behavioral interventions, and practical support for families, Dr. Phạm Minh Triết brings premier scientific expertise to translate evidence-based behavioral strategies into scalable support systems for parents and child welfare practitioners.",advocacy:"Doctoral & Cross-Cultural Clinical Research (ANU): Conducted doctoral research at the Australian National University (ANU) focused on adapting Western evidence-based behavioral parenting interventions to effectively reduce disruptive child behaviors within the Vietnamese cultural context.  \n\nRandomized Controlled Trial Publication (IJCHP, 2024): Published a randomized controlled trial in the International Journal of Clinical and Health Psychology demonstrating that therapist-facilitated, brief online behavioral parent training significantly improves child behavior and parent-child interactions in Vietnam.",relevantLinks:"https://hcmussh.edu.vn/tin-tuc/trothanhhinhmauchotrenho \n\nhttps://openresearch-repository.anu.edu.au/items/3ecd6e35-ebde-4169-9358-239a40def2be \n\nhttps://www.sciencedirect.com/science/article/pii/S1697260024000139?via%3Dihub",themes:"Mental Health & Wellbeing, Inclusion & Disability",primary:"facebook"},{name:"Giám đốc CSAGA Nguyễn Vân Anh",tier:"Micro",sector:"Development & Civil",unicef:false,top60:false,type:"Field Experts",instagram:null,tiktok:null,youtube:null,facebook:{followers:11876,link:"https://www.facebook.com/nguyen.v.anh.18",avgViews:0,username:"nguyen.v.anh.18"},bio:"Nguyễn Vân Anh is the Founding Chairwoman and Executive Director of CSAGA, standing as one of Vietnam's most prominent social activists. Over nearly three decades, she has spearheaded groundbreaking community projects to combat gender-based violence, advance rights for women and LGBTI+ individuals, and protect vulnerable children. With nearly three decades of pioneering institutional advocacy, legislative drafting, and direct crisis support networks, Nguyễn Vân Anh brings unmatched social activism experience and civil society leadership to champion the protection of vulnerable women and children.",advocacy:"Pioneering Survivor Hotlines & Founding CSAGA (1997–2001): Established Northern Vietnam's first psychological hotline (Linh Tâm) to support abused women, evolving it into CSAGA—an NGO that has executed over 60 projects, produced 300 media assets, and handled tens of thousands of hotline calls for survivors of domestic abuse, trafficking, and LGBTI+ individuals.\n\nNational Legislative & Policy Coalition (DOVIPNet to GBVnet): Co-founded and led DOVIPNet (now GBVnet), actively lobbying and contributing to the drafting of Vietnam’s landmark national domestic violence prevention laws and expanding network actions to target sexual harassment, trafficking, and workplace discrimination.\n\nForbes Recognition & National Advocacy Campaigns: Recognized among Forbes Vietnam's 50 Most Influential Women (2017) for pioneering large-scale campaigns like \"From Windows to the Bridge\" and child protection initiatives, reaching millions of beneficiaries nationwide.",relevantLinks:"https://vietnam.vnanet.vn/english/tin-tuc/van-anh-fighting-for-gender-equality-184337.html \n\nhttps://csaga.org.vn/lich-su-thanh-lap.html \n\nhttps://baotintuc.vn/long-form/megastory/nguyen-van-anhca-doi-di-tim-lai-khat-vong-song-cho-nu-gioi-20180323202124365.htm \n\nhttps://msdvietnam.org/tcbc-chien-dich-hanh-dong-ngay-cung-gbvnet-bao-ve-tre-em-khoi-xam-hai-tinh-duc-va-toa-dam-truc-tuyen-an-toan-cho-tre-em-gai-phong-tranh-quay-roi-xam-hai-tre-em/",themes:"Girl's Education & STEAM, Mental Health & Wellbeing, Ending Violence Against Women & Children",primary:"facebook"},{name:"Thảo Griffiths",tier:"Micro",sector:"Development & Civil",unicef:false,top60:false,type:"Field Experts",instagram:null,tiktok:null,youtube:null,facebook:{followers:19000,link:"https://www.facebook.com/ThaoNguyenGriffiths",avgViews:0,username:"ThaoNguyenGriffiths"},bio:"Thảo Griffiths (Nguyễn Thị Thu Thảo) is a high-level public policy director at Meta, international humanitarian commissioner, and prominent former NGO leader. With master’s degrees from RMIT and American University as a Fulbright Scholar and Eisenhower Fellow, she is widely recognized globally for her decades of bridging U.S.–Vietnam international diplomacy and tech policy. A distinguished international policy leader and diplomat, Thảo Griffiths brings high-level governance expertise, global media reach, and strategic tech policy insight capable of driving multi-sectoral partnerships and digital safety initiatives at the highest legislative levels.",advocacy:"Meta Tech & Public Policy Leadership: Serves as Meta's Regional Director of Public Policy (CLMV), driving strategic regional policy initiatives on internet safety, privacy, digital economy growth, and national AI development ecosystems.  \nU.S.–Vietnam Reconciliation & War Legacy Advocacy: Spent over two decades facilitating bilateral U.S.–Vietnam relations and war reconciliation efforts, earning personal commendations from top U.S. leaders and an official tribute in the U.S. Congressional Record.\nGlobal Humanitarian Governance & Photojournalism Boards: Serves as an international Commissioner for the ICMP (The Hague) working on global missing persons issues, alongside serving on the Board of Trustees for the VII Foundation to empower new voices in visual journalism",relevantLinks:"https://www.tatlerasia.com/people/thao-griffiths-vn?listId=383&fbclid=IwY2xjawTPvmJwZG9mBWV4dG4DYWVtAjEwAGJyaWQRMTh1bUZaUWhuSnp4cTJSNTNzcnRjBmFwcF9pZBAyMjIwMzkxNzg4MjAwODkyAAEespQ8rw1T8PjAcvmZAljyCRsKEMBDeLD9Pkfp3yz6PP01EjP2ErZLL4TLPf4_aem_qS-EtjCG7qSzieCbGUA-tQ \n\nhttps://amchamvietnam.com/about/committees/digital-economy-and-technology/ \n\nhttps://icmp.int/news/thao-griffiths-joins-icmp-board-of-commissioners/  \n\nhttps://www.australiavietnam.org/2024-avyld-speakers/thao-griffiths \n\nhttps://www.efworld.org/network-programs/global-and-regional-events/2024-annual-meeting-2/ \n\nhttps://www.youtube.com/watch?v=MbluRhaDFdI \n\nhttps://vovworld.vn/thats-life/vietnamese-expertise-promoted-to-bring-vietnam-to-the-world-2072978.vov5#:~:text=Thao%20Griffiths%20who%20creates%20the%20foundation%20for,of%20Meta%20Technology%20Group%20of%20the%20US. \n\nhttps://en.nhandan.vn/viet-nams-position-and-ambition-on-the-global-artificial-intelligence-map-post163334.html#:~:text=%E2%80%9CThis%20journey%20carries%20the%20mission%20of%20taking,strategic%20partnership%20of%20the%20National%20Innovation%20Centre. \n\nhttps://en.nhandan.vn/viet-nams-position-and-ambition-on-the-global-artificial-intelligence-map-post163334.html#:~:text=Explaining%20why%20Meta%20decided%20to%20partner%20with,of%20the%20most%20dynamic%20in%20Southeast%20Asia. \n\nhttps://www.aljazeera.com/video/101-east/2009/9/10/agent-orange-still-haunts-vietnam#:~:text=As%20babies%20across%20Vietnam%20continue%20to%20be,Michael%20Michalak%2C%20the%20US%20ambassador%20to%20Vietnam.",themes:"Youth Participation, Ending Violence Against Women & Children",primary:"facebook"},{name:"Trần Nam Dũng",tier:"Micro",sector:"STEAM Education",unicef:false,top60:false,type:"Field Experts",instagram:null,tiktok:null,youtube:null,facebook:{followers:35119,link:"https://www.facebook.com/tran.namdung/",avgViews:0,username:"tran.namdung"},bio:"He is a prominent mathematics educator, researcher, and mentor for gifted students. He currently serves as the Vice Principal of High School for the Gifted of VNU - HCMC and a senior lecturer in the Faculty of Mathematics and Computer Science at VNU - HCM University of Science. Beyond academia, he is the founder of Epsilon Magazine and Mathley, as well as the head coach for numerous Vietnam IMO teams. He is widely celebrated for his passionate, humanistic approach to teaching math, transforming abstract logical concepts into inspiring toolkits for creative problem-solving and life skills. As a highly respected academic figure and innovator in open-access STEM education, TS. Trần Nam Dũng brings deep authority and pedagogical experience to champion quality, inclusive learning opportunities and critical thinking skills for students across Vietnam.",advocacy:"2015 - Present: Founded and worked as the editor-in-chief for Epsilon Magazine, a free online magazine specializing in mathematics for the community of maths enthusiasts, students, and educators.\n\nServing as the coach for Vietnam's International Mathematical Olympiad teams.",relevantLinks:"https://thanhnienviet.vn/tien-si-tran-nam-dung-yeu-toan-hoc-hon-ca-ban-than-minh-209243107164311020.htm",themes:"Girl's Education & STEAM",primary:"facebook"},{name:"Lê Yên Thanh",tier:"Nano",sector:"Technology",unicef:false,top60:false,type:"Field Experts",instagram:null,tiktok:null,youtube:null,facebook:{followers:0,link:"https://www.facebook.com/yenthanh132",avgViews:0,username:"yenthanh132"},bio:"He is a young technology entrepreneur, software engineer, and innovator. Renowned for building tech solutions for AI application in transportation, he is the Founder and CEO of BusMap and GoLabs while supporting HCMC Management Centre of Public Transport in future planning, infrastructure development, and public transport policy. As an award-winning young innovator and pioneer in accessible public infrastructure, Lê Yên Thanh offers exceptional value to inspire youth digital skill-building, champion eco-friendly smart cities, and advocate for safe, inclusive urban mobility for children and families across Vietnam.",advocacy:"Founding BusMap & Phenikaa MaaS: Created BusMap, Vietnam’s leading free public transit navigation platform with millions of users, expanding it into smart mobility company Phenikaa MaaS.  Forbes 30 Under 30 & Tech Honors (2022)\n\nNamed to Forbes 30 Under 30 Asia and Forbes 30 Under 30 Vietnam for his achievements in smart transportation, digital innovation, and urban technology startups.\n\nPublic Transport & Digital Governance Advisory: Collaborates directly with the Ho Chi Minh City Management Centre of Public Transport and serves on the Executive Committee of the Vietnam Association for Information Processing (VAIP) to advance smart urban infrastructure and digital transport policy.",relevantLinks:"https://vnexpress.net/le-yen-thanh-4914036.html \n\nhttps://www.forbes.com/profile/le-yen-thanh/#:~:text=Thanh%20founded%20the%20BusMap%20Project%2C%20a%20Vietnamese,starting%20in%20Thailand%2C%20where%20it%20has%20pilot \n\nhttps://www.ajzlc.com/members/thanh_le#:~:text=In%202023%2C%20Thanh%20became%20the%20youngest%20person,If%20you%20have%20any%20questions%20or%20concerns%2C",themes:"Digital Education & Skills",primary:"instagram"},{name:"Lý Thị Mai",tier:"Micro",sector:"Health & Wellness",unicef:false,top60:false,type:"Field Experts",instagram:null,tiktok:null,youtube:null,facebook:{followers:61000,link:"https://www.facebook.com/Lythimai.Chuyengiatamly",avgViews:0,username:"Lythimai.Chuyengiatamly"},bio:"She is a respected clinical psychologist and family counselor with over three decades of dedicated practice in psychological counseling and emotional therapy. She is the Director of the HCMC Applied Psychology Counseling Center and the author of numerous popular books on family harmony, parenting, and emotional well-being. As one of Vietnam’s most recognized and trusted authorities in clinical family counseling, TS. Lý Thị Mai offers immense household brand equity to effectively promote positive parenting strategies, emotional resilience, and family-centered mental healthcare on a national public scale.",advocacy:"Director of HCMC Applied Psychology Counseling Center & Media Expert: Founded and directs the center, delivering direct clinical counseling, life skills training, and hosting iconic, long-running broadcast programs (e.g., Trò chuyện đêm khuya, Tình yêu - Hôn nhân - Gia đình).  \n\nNational Record Holder & Prolific Author: Holds official Vietnamese Records for media psychological counseling hours and total published Q&A life skill books, having authored nearly 40 books including the 14-volume community welfare series Cùng xây tổ ấm.  \n\nExecutive Leadership in Psychological & Cultural Associations: Serves on the Central Executive Committee of the Vietnam Association of Psycho-Pedagogy and as Vice Director of the Vietnam Records Research Institute, promoting emotional wellness across schools, healthcare facilities, and corporate environments.",relevantLinks:"http://hoinutrithuctphcm.vn/blogs/detail/1917 \n\nhttps://kyluc.vn/tin-tuc/ky-luc-viet-nam/vietkings-ths-ly-thi-mai-chuyen-gia-tam-ly-duoc-menh-danh-la-nguoi-ban-tin-cay-cua-moi-nha#:~:text=B%C3%A0%20l%C3%A0%20chuy%C3%AAn%20gia%20t%C6%B0%20v%E1%BA%A5n%20t%C3%A2m,h%E1%BB%8Fi%20v%C3%A0%20tr%E1%BA%A3%20l%E1%BB%9Di%20nhi%E1%BB%81u%20nh%E1%BA%A5t%E2%80%9D%20(2013).",themes:"Mental Health & Wellbeing, Positive Parenting",primary:"facebook"},{name:"Hiếu PC",tier:"Mid",sector:"Technology",unicef:false,top60:false,type:"Field Experts",instagram:null,tiktok:null,youtube:null,facebook:{followers:432000,link:"https://www.facebook.com/hieupc.7onez",avgViews:0,username:"hieupc.7onez"},bio:"He is a Vietnamese cybersecurity specialist, former hacker, and digital safety advocate. After serving time in the U.S. for cybercrime offenses, he underwent a public transformation upon his return to Vietnam, dedicating his expertise to protecting internet users. He currently works as a cybersecurity specialist at the Vietnam National Cyber Security Center. As a high-profile cybersecurity expert with practical technical tools and strong youth appeal, Hiếu PC offers direct impact to drive nationwide awareness around digital safety, protect children from online scams, and build digital skills for vulnerable youth.",advocacy:"2020 - Present: Co-founded and managed Chống Lừa Đảo (Fight Scams), a non-profit project and browser extension that identifies and blocks fraudulent websites, phishing scams, and malicious online domains to safeguard Vietnamese web users.\n\n2025: Joined the \"Digital Literacy for All\" team (Bình dân học vụ số), an initiative of the Vietnam Association of Youth with Disabilities, aiming to train and support young people with disabilities in accessing technology, developing digital skills, and applying these skills to their work and studies.\n\nFrequently joined in public and school workshops on his journey of reformation, cybersecurity and online safety.",relevantLinks:"https://special.nhandan.vn/hieupc-du-lieu-ca-nhan/index.html\n\nhttps://vnexpress.net/hieu-pc-chim-se-di-nang-tham-gia-doi-hinh-binh-dan-hoc-vu-so-4860501.html\n\nhttps://tienphong.vn/hieu-pc-ke-hanh-trinh-tu-hacker-khet-tieng-the-gioi-den-no-luc-lam-lai-cuoc-doi-post1794989.tpo",themes:"Digital Education & Skills, Child Online Safety",primary:"facebook"},{name:"Nguyễn Cảnh Bình",tier:"Micro",sector:"Social Entrepreneurs",unicef:false,top60:false,type:"Field Experts",instagram:null,tiktok:null,youtube:null,facebook:{followers:61000,link:"https://www.facebook.com/canhbinh.nguyen",avgViews:0,username:"canhbinh.nguyen"},bio:"He is a prominent intellectual, publishing pioneer, civic educator, and social entrepreneur. He is the Founder and Chairman of Alpha Books and Omega Plus Books, two publishing houses specializing in business, social sciences, history, and classical literature. Deeply committed to civic education and leadership development, he founded the Vietnam Leadership Institute and the Vietnam Center for Research and Education, initiatives dedicated to training young leaders, policy researchers, and social innovators. Over his multi-decade career, he has consistently advocated for a culture of reading, lifelong learning, and active civic engagement among Vietnamese youth. With extensive expertise in publishing and youth leadership development, Nguyễn Cảnh Bình provides a strong platform to champion child literacy, expand access to educational resources, and empower the next generation of young civic leaders across Vietnam.",advocacy:"Youth Leadership Development (ABG Leadership Institute): Founded the ABG Leadership Institute and the Vietnam Leadership Center, creating structured training programs and fellowships for young leaders, social innovators, and policy researchers.\n\nNational Reading Advocacy Initiatives: Initiated wide-reaching community literacy programs, including \"Journey of Knowledge\" (Hành trình Tri thức), \"Reading Together,\" and \"Reading Culture Ambassadors\" to expand book access for youth nationwide.",relevantLinks:"https://nhandan.vn/special/doanhnhannguyencanhbinh/index.html",themes:"Youth Participation, Girl's Education & STEAM",primary:"facebook"},{name:"Thầy giáo Nguyễn Thành Nam",tier:"Mid",sector:"STEAM Education",unicef:false,top60:false,type:"Field Experts",instagram:null,tiktok:null,youtube:null,facebook:{followers:113413,link:"https://www.facebook.com/LittleZerooos",avgViews:0,username:"LittleZerooos"},bio:"He is a distinguished Vietnamese educator, physics lecturer, and pioneer in online education in Vietnam. With over two decades of experience teaching and developing innovative physics curricula, he is well-known for his engaging, intuitive teaching methodology that bridges rigorous theoretical physics with real-world applications. He is a leading voice in STEM education, digital learning transformation, and critical thinking for Vietnamese youth. Nguyễn Thành Nam offers strong educational credibility to champion quality STEM learning, modern study methodologies, and accessible digital education tools for Vietnamese youth.",advocacy:"2010 - 2012: Education Specialist at UNESCO Hanoi, where he worked on a UNESCO-funded project linking schools with museums, heritage sites, and historical-cultural locations in Hanoi to foster heritage education.\n\nServed as a study method advisor for the VTV7 television channel.\n\nTaught at the Military Technical Academy and VTV7.\n\nParticipated in developing primary education materials with Ô Xinh Club and Cánh Buồm group.",relevantLinks:"https://hocmai.vn/giao-vien/198/thay-nguyen-thanh-nam.html",themes:"Girl's Education & STEAM",primary:"facebook"},{name:"Trần Quốc Khánh",tier:"Micro",sector:"Social Entrepreneurs",unicef:false,top60:false,type:"Field Experts",instagram:null,tiktok:null,youtube:null,facebook:{followers:93176,link:"https://www.facebook.com/qkhanh",avgViews:0,username:"qkhanh"},bio:"He is a leading Vietnamese media entrepreneur, TV host, moderator, and content creator specializing in business, innovation, and leadership. He is the Founder and CEO of VIETSUCCESS, one of Vietnam's leading digital media platforms for business insights, startup stories, and professional development. Known for interviewing top corporate leaders and entrepreneurs, he is also an active public speaker, translator, and an advocate for youth entrepreneurship and financial literacy. With his extensive media reach and strong connection to the business community, Trần Quốc Khánh offers a compelling platform to promote youth financial literacy, inspire young entrepreneurs, and mobilize corporate social responsibility initiatives for children.",advocacy:"Founding & Leading VIETSUCCESS: Founded and serves as CEO of VIETSUCCESS, building a premier digital media platform focused on business knowledge, executive leadership insights, and startup stories for young Vietnamese professionals.",relevantLinks:"https://innoex.vn/vi/team/tran-quoc-khanh/",themes:"Digital Education & Skills, Youth Participation",primary:"facebook"},{name:"Đào Lê Tâm An",tier:"Micro",sector:"Health & Wellness",unicef:false,top60:false,type:"Field Experts",instagram:null,tiktok:null,youtube:null,facebook:{followers:34453,link:"https://www.facebook.com/daoletaman",avgViews:0,username:"daoletaman"},bio:"He is a psychologist, content creator, and PhD candidate specializing in adolescent psychology, school mental health, and social-emotional development. Widely known for bridging academic psychology with youth culture, he delivers accessible mental health education to hundreds of thousands of students, young adults, and educators across Vietnam. With his strong connection to youth culture, advocacy in sexual and reproductive health, and expertise in adolescent psychology, Đào Lê Tâm An provides a relatable, credible platform to champion mental health awareness, emotional resilience, and safe life-skills education for adolescents nationwide.",advocacy:"2019 - 2020: Pioneer Youth in Sexual and Reproductive Health and Safe Sex under the program organized by the Center for Creative Initiatives in Health and Population in partnership with the Ministry of Foreign Affairs of the Kingdom of the Netherlands.\n\nFrequently joined in public workshops and school consultation programs on mental health and career orientation.",relevantLinks:"https://www.hutech.edu.vn/homepage/tin-tuc/hoat-dong-sinh-vien/14596612-chuyen-gia-dao-le-tam-an-cung-sinh-vien-hutech-dinh-huong-tinh-yeu-sinh-vien-thoi-4-0",themes:"Mental Health & Wellbeing",primary:"facebook"},{name:"Nhà báo Trần Thu Hà",tier:"Mid",sector:"Family & Parenting",unicef:false,top60:false,type:"Field Experts",instagram:null,tiktok:null,youtube:null,facebook:{followers:288801,link:"https://www.facebook.com/thuha.mexusim/",avgViews:0,username:"thuha.mexusim"},bio:"Widely known by her pen name and online persona Mẹ Xu Sim, she is a prominent Vietnamese journalist, author, and widely followed advocate for modern parenting and child education. She is the author of several bestselling parenting books, focusing on child independence, emotional intelligence, open communication, and respectful, non-coercive education. As a highly trusted journalist and influential voice among Vietnamese parents, rom genital malformations and severe physical trauma.",relevantLinks:"https://www.momo.vn/song-tot/thien-nhan-friends\n\nhttps://danviet.vn/me-coi-tran-mai-anh-nguoi-chat-chiu-ngot-ngao-tu-muon-noi-kho-dau-20200810083515407-d902798.html",themes:"Ending Violence Against Women & Children, Inclusion & Disability, Positive Parenting",primary:"facebook"},{name:"Vũ Kim Hạnh",tier:"Micro",sector:"Social Entrepreneurs",unicef:false,top60:false,type:"Field Experts",instagram:null,tiktok:null,youtube:null,facebook:{followers:54921,link:"https://www.facebook.com/tho.nguyentan.9210",avgViews:0,username:"tho.nguyentan.9210"},bio:"She is a respected veteran journalist, social entrepreneur, and business association leader. As a former Editor-in-Chief of Tuổi Trẻ newspaper, she played a pivotal role in modernizing Vietnamese journalism before shifting her focus to economic development and domestic enterprise support. She is the founder and President of the Business Association of High-Quality Vietnamese Goods and the Leading Business Club, initiatives that have spent decades helping local small and medium enterprises, agricultural startups, and rural entrepreneurs elevate product quality, sustainability, and market reach. Recognized as a pioneer in community-driven economic development, she continues to host digital media shows and mentor young founders across the country. With her extensive influence across domestic business networks, agricultural communities, and national media, Vũ Kim Hạnh provides strong grassroots leadership to advocate for sustainable rural livelihoods, youth entrepreneurship, and community economic resilience for vulnerable families.",advocacy:"Founding & Leading High-Quality Vietnamese Goods Association: Founded and serves as President of the Business Association of High-Quality Vietnamese Goods (BSA), leading national campaigns for nearly three decades to elevate local enterprise standards, product quality, and market access.\n\nAgricultural Startup Incuba const PLATS=["tiktok","instagram","youtube","facebook"];

function computePrimary(d){
  let best=null;
  for(const p of PLATS){const pl=d[p];if(!pl)continue;
    const hasAny=pl.link||pl.followers!=null||pl.er!=null;if(!hasAny)continue;
    const er=pl.er!=null?pl.er:-1, fol=pl.followers!=null?pl.followers:-1, cand=[er,fol,p];
    if(!best||cand[0]>best[0]||(cand[0]===best[0]&&cand[1]>best[1]))best=cand;}
  return best?best[2]:null;
}
function bestFollowers(d){let m=0;for(const p of PLATS){const pl=d[p];if(pl&&pl.followers)m=Math.max(m,pl.followers);}return m;}
function computeScores(d){
  const plats=['instagram','tiktok','youtube','facebook'];
  // --- Engagement Score (0-100) ---
  const ers=plats.map(p=>d[p]&&d[p].er!=null?d[p].er:null).filter(v=>v!=null);
  let bestEr=ers.length?Math.max(...ers):null;
  if(bestEr==null){const maxFol0=Math.max(...plats.map(p=>d[p]&&d[p].followers||0));if(maxFol0>=1000000)bestEr=1;else if(maxFol0>=500000)bestEr=1.5;else if(maxFol0>=100000)bestEr=2;else if(maxFol0>=10000)bestEr=3;else if(maxFol0>0)bestEr=5;}
  const erScore=bestEr!=null?Math.min(100,Math.round(bestEr/6*100)):null;
  const aqsVals=['instagram','tiktok'].map(p=>d[p]&&d[p].aqs!=null?d[p].aqs:null).filter(v=>v!=null);
  const aqsAvg=aqsVals.length?aqsVals.reduce((a,b)=>a+b,0)/aqsVals.length:null;
  d._eng=(erScore!=null&&aqsAvg!=null)?Math.min(100,Math.round(.55*erScore+.45*aqsAvg)):erScore!=null?erScore:aqsAvg!=null?Math.round(aqsAvg):null;
  // --- Risk Score (0-100, lower=safer) ---
  function bsNum(v){if(!v)return 40;const l=v.toLowerCase();if(l.includes('unsafe')||l.includes('high risk'))return 85;if(l.includes('risky')||l.includes('medium'))return 55;if(l.includes('neutral'))return 30;return 12;}
  const bsVals=['instagram','youtube'].map(p=>d[p]&&d[p].brand_safety?bsNum(d[p].brand_safety):null).filter(v=>v!=null);
  const bsAvg=bsVals.length?bsVals.reduce((a,b)=>a+b,0)/bsVals.length:40;
  const aqsRisk=aqsAvg!=null?Math.max(0,100-aqsAvg):40;
  d._risk=Math.min(100,Math.round(.6*bsAvg+.4*aqsRisk));
  // --- Partnership Potential Score (0-100) ---
  const maxFol=Math.max(...plats.map(p=>d[p]&&d[p].followers||0));
  const reachScore=maxFol>0?Math.min(100,Math.max(0,Math.round((Math.log10(maxFol)-3)/(7-3)*100))):0;
  const safeBonus=bsVals.length&&bsVals.every(v=>v<=15)?8:0;
  const unicefBonus=d.unicef?7:0;
  const erP=erScore!=null?erScore:50;const aqsP=aqsAvg!=null?Math.round(aqsAvg):50;
  d._partner=Math.min(100,Math.round(.35*reachScore+.32*erP+.33*aqsP)+safeBonus+unicefBonus);
}
DATA.forEach((d,i)=>{d._primary=computePrimary(d);d._best=bestFollowers(d);d._idx=i;computeScores(d);});

function fmt(n){if(n==null)return null;if(n>=1e6)return (n/1e6).toFixed(n>=1e7?0:1).replace(/\.0$/,"")+"M";if(n>=1e3)return Math.round(n/1e3)+"K";return ""+n;}

function renderCharts(rows){
  const total=rows.length||1;
  const secCount={};rows.forEach(d=>secCount[d.sector]=(secCount[d.sector]||0)+1);
  const secEntries=Object.entries(secCount).sort((a,b)=>b[1]-a[1]);
  const secColorMap={};secEntries.forEach(([n],i)=>secColorMap[n]=SECTOR_COLORS[i%SECTOR_COLORS.length]);
  const C=2*Math.PI*54;let donut="",off=0;
  secEntries.forEach(([name,ct])=>{const frac=ct/total,len=frac*C,col=secColorMap[name];
    donut+=`<circle cx="68" cy="68" r="54" fill="none" stroke="${col}" stroke-width="20" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 68 68)"><title>${name}: ${ct} (${(frac*100).toFixed(1)}%)</title></circle>`;off+=len;});
  const secLegend=secEntries.map(([name,ct])=>`<div class="leg-item" onclick="setFilter('sector','${name.replace(/'/g,"\\'")}')"><span class="leg-dot" style="background:${secColorMap[name]}"></span><span class="leg-name">${name}</span><span class="leg-pct">${(ct/total*100).toFixed(0)}%</span><span class="leg-val">${ct}</span></div>`).join("");

  const tierCount={};rows.forEach(d=>tierCount[d.tier]=(tierCount[d.tier]||0)+1);
  const tierOrder=["Mega","Macro","Mid","Micro","Nano"];
  const tierColor={Mega:"#3730A3",Macro:"#1D4ED8",Mid:"#0891B2",Micro:"#1CABE2",Nano:"#94A3B8"};
  let tDonut="",tOff=0;
  tierOrder.forEach(t=>{const ct=tierCount[t]||0;if(!ct)return;const frac=ct/total,len=frac*C;
    tDonut+=`<circle cx="68" cy="68" r="54" fill="none" stroke="${tierColor[t]}" stroke-width="20" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-tOff}" transform="rotate(-90 68 68)"><title>${t}: ${ct}</title></circle>`;tOff+=len;});
  const tierLegend=tierOrder.filter(t=>tierCount[t]).map(t=>`<div class="leg-item" onclick="setFilter('tier','${t}')"><span class="leg-dot" style="background:${tierColor[t]}"></span><span class="leg-name">${t}</span><span class="leg-pct">${((tierCount[t]||0)/total*100).toFixed(0)}%</span><span class="leg-val">${tierCount[t]||0}</span></div>`).join("");

    const bg=p==='instagram'?'linear-gradient(135deg,#F58529,#DD2A7B,#8134AF)':PCOLOR[p];

  const summaryLabel = tab==="top60" ? "Executive summary · Drilled-down Top 60" : "Executive summary · Full directory";
  document.getElementById("charts").innerHTML=`
    <div class="chart-card"><div class="chart-title">Sector Split</div><div class="chart-sub">${secEntries.length} sectors · click to filter</div>
      <div class="donut-wrap"><svg class="donut" width="136" height="136" viewBox="0 0 136 136">${donut}<text class="donut-center" x="68" y="66" text-anchor="middle">${total}</text><text class="donut-center-sub" x="68" y="80" text-anchor="middle">KOLs</text></svg><div class="legend">${secLegend}</div></div></div>
    <div class="chart-card"><div class="chart-title">Tier Split</div><div class="chart-sub">By follower-size tier · click to filter</div>
      <div class="donut-wrap"><svg class="donut" width="136" height="136" viewBox="0 0 136 136">${tDonut}<text class="donut-center" x="68" y="66" text-anchor="middle">${total}</text><text class="donut-center-sub" x="68" y="80" text-anchor="middle">KOLs</text></svg><div class="legend">${tierLegend}</div></div></div>
    <div class="chart-card"><div class="chart-title">Primary Platform</div><div class="chart-sub">Count of KOLs whose best-engagement channel is each platform</div><div class="hbars">${pBars}</div></div>`;

function renderSidebar(){
  function countBy(key,val){
    return scope().filter(d=>{
      if(state.q){const q=norm(state.q);const hit=[d.name,d.bio].some(s=>norm(s).includes(q));if(!hit)return false;}
      if(key!=="sector"&&state.sector!=="All"&&d.sector!==state.sector)return false;
      if(key!=="tier"&&state.tier!=="All"&&d.tier!==state.tier)return false;
      if(key!=="platform"&&state.platform!=="All"&&d._primary!==state.platform)return false;
      if(key!=="unicef"&&state.unicef&&!d.unicef)return false;
      if(key!=="themes"&&state.themes!=="All"&&!(d.themes||"").split(/[,;|]+/).map(t=>t.trim()).some(t=>t===state.themes))return false;
      if(key==="sector")return d.sector===val;
      if(key==="tier")return d.tier===val;
      if(key==="platform")return d._primary===val;
      if(key==="unicef")return d.unicef;
      if(key==="themes")return (d.themes||"").split(/[,;|]+/).map(t=>t.trim()).some(t=>t===val);
      return true;
    }).length;
  }
  const sectors=[...new Set(scope().map(d=>d.sector))].sort((a,b)=>countBy("sector",b)-countBy("sector",a));
  const tiers=["Mega","Macro","Mid","Micro","Nano"];
  const secColors={};sectors.forEach((s,i)=>secColors[s]=SECTOR_COLORS[i%SECTOR_COLORS.length]);
  const tierColor={Mega:"#3730A3",Macro:"#1D4ED8",Mid:"#0891B2",Micro:"#1CABE2",Nano:"#94A3B8"};
  function opt(key,val,label,dot){
    const active=state[key]===val;
    const ct=countBy(key,val);
    const dotHtml=dot?`<span class="f-dot" style="background:${dot}"></span>`:"";
    return `<div class="f-opt ${active?'active':''}" onclick="setFilter('${key}','${val.replace(/'/g,"\\'")}')"><span class="f-row">${dotHtml}<span class="f-name">${label}</span></span>${val==='All'?'':`<span class="f-ct">${ct}</span>`}</div>`;
  }
  const ucCount=countBy("unicef",true);
  const ucOpt=`<div class="f-opt ${state.unicef?'active':''}" onclick="toggleUnicef()"><span class="f-row"><span class="f-dot" style="background:#1CABE2"></span><span class="f-name">UNICEF-engaged only</span></span><span class="f-ct">${ucCount}</span></div>`;
  document.getElementById("sidebar").innerHTML=`
    <div class="side-block"><div class="side-h">UNICEF Engagement</div>${ucOpt}<div style="font-size:10.5px;color:var(--muted);padding:6px 10px 0;line-height:1.5">KOLs currently or previously engaged by UNICEF Vietnam.</div></div>
    <div class="side-block"><div class="side-h">Tier</div>${opt("tier","All","All tiers")}${tiers.map(t=>opt("tier",t,t,tierColor[t])).join("")}</div>
    <div class="side-block"><div class="side-h">Primary Platform</div>${opt("platform","All","All platforms")}${PLATS.map(p=>opt("platform",p,PLABEL[p],PCOLOR[p])).join("")}</div>
    <div class="side-block"><div class="side-h">Sector</div>${opt("sector","All","All sectors")}${sectors.map(s=>opt("sector",s,s,secColors[s])).join("")}</div>
    <div class="side-block"><div class="side-h">UNICEF Priority Themes</div>${opt("themes","All","All themes")}${[...new Set(scope().flatMap(d=>(d.themes||"").split(/[,;|]+/).map(t=>t.trim()).filter(Boolean)))].sort().map(t=>opt("themes",t,t)).join("")}</div><div class="side-block"><button class="reset-btn" onclick="resetFilters()">↺ Reset all filters</button></div>`;
}

function scoreBarHtml(d){
  if(!d.top60)return "";
  function srow(label,val,fillCls,color){
    if(val==null)return "";
    return `<div class="score-row"><span class="score-lbl">${label}</span><div class="score-track"><div class="score-fill ${fillCls}" style="width:${val}%"></div></div><span class="score-val" style="color:${color}">${val}</span></div>`;
  }
  const rCls=d._risk==null?'score-risk-low':d._risk<=33?'score-risk-low':d._risk<=66?'score-risk-mid':'score-risk-hi';
  const rCol=d._risk==null?'#10B981':d._risk<=33?'#10B981':d._risk<=66?'#F59E0B':'#EF4444';
  const rows=[srow('Engagement','score-eng','#374EA2',d._eng),srow('Risk Level',rCls,rCol,d._risk),srow('Partnership','score-partner','#8B5CF6',d._partner)].join('');
  if(!rows)return "";
  // fix: use proper fill classes inline
  const eng=d._eng!=null?`<div class="score-row"><span class="score-lbl" ${tip(TIPS.engScore)}>Engagement${tipIcon('engScore')}</span><div class="score-track"><div class="score-fill score-eng" style="width:${d._eng}%"></div></div><span class="score-val" style="color:#374EA2">${d._eng}</span></div>`:"";
  const risk=d._risk!=null?`<div class="score-row"><span class="score-lbl" ${tip(TIPS.riskScore)}>Risk Level${tipIcon('riskScore')}</span><div class="score-track"><div class="score-fill ${rCls}" style="width:${d._risk}%"></div></div><span class="score-val" style="color:${rCol}">${d._risk}</span></div>`:"";
  const part=d._partner!=null?`<div class="score-row"><span class="score-lbl" ${tip(TIPS.partnerScore)}>Partnership${tipIcon('partnerScore')}</span><div class="score-track"><div class="score-fill score-partner" style="width:${d._partner}%"></div></div><span class="score-val" style="color:#8B5CF6">${d._partner}</span></div>`:"";
  if(!eng&&!risk&&!part)return "";
  return `<div class="card-scores">${eng}${risk}${part}</div>`;
}
function erClass(er){if(er==null)return"er-lo";if(er>=5)return"er-hi";if(er>=2)return"er-mid";return"er-lo";}
function initials(name){const parts=name.trim().split(/\s+/).filter(w=>/[\p{L}]/u.test(w));const a=parts[parts.length-2]||parts[0]||"";const b=parts[parts.length-1]||"";return ((a[0]||"")+(b[0]||"")).toUpperCase();}

function avatarHtml(d){
  const init=initials(d.name);const p=d._primary;
  const cands=[];
  if(d.photo_url)cands.push(d.photo_url);
  // TikTok first — unavatar.io/tiktok reliably returns 200; instagram returns 403
  const order=["tiktok",p,"instagram","youtube","facebook"].filter(Boolean);const seen={};
  for(const pl of order){if(seen[pl])continue;seen[pl]=1;const o=d[pl];
    if(o&&o.username){const u=encodeURIComponent(o.username.replace(/^@/,""));
      if(pl==="instagram")cands.push(`https://unavatar.io/instagram/${u}?fallback=false`);
      else if(pl==="tiktok")cands.push(`https://unavatar.io/tiktok/${u}?fallback=false`);
      else if(pl==="youtube")cands.push(`https://unavatar.io/youtube/${u}?fallback=false`);
      else if(pl==="facebook")cands.push(`https://unavatar.io/facebook/${u}?fallback=false`);}}
  const ppIcon=p?`<span class="pp-badge" style="background:${p==='instagram'?'#DD2A7B':PCOLOR[p]}" title="Best-engagement platform: ${PLABEL[p]}"><span style="font-size:8px;color:#fff;font-weight:800">${PSHORT[p]}</span></span>`:"";
  const key="ava2_"+norm(d.name);
  if(cands.length){const candsAttr=JSON.stringify(cands).replace(/"/g,"&quot;");
    return `<div class="avatar" data-ava-key="${key}" data-ava-cands="${candsAttr}"><img src="" alt="${d.name}" style="display:none" loading="lazy"><span class="initials">${init}</span>${ppIcon}</div>`;}
  return `<div class="avatar"><span class="initials">${init}</span>${ppIcon}</div>`;
}

function platRow(d,p){
  const pl=d[p];if(!pl||(!pl.link&&!pl.followers&&pl.er==null))return "";
  const isPrim=d._primary===p;

function card(d){
  const primLink=(d._primary&&d[d._primary]&&d[d._primary].link)||(PLATS.map(p=>d[p]&&d[p].link).find(Boolean));
  const nameHtml=primLink?`<a href="${primLink}" target="_blank" rel="noopener">${d.name}</a>`:d.name;

    ${avatarHtml(d)}

function render(){
  const rows=filtered();
  rows.sort((a,b)=>state.sortMetric==="name"?norm(a.name).localeCompare(norm(b.name)):sortVal(b)-sortVal(a));
  renderCharts(rows);renderSidebar();updateResetBtn();
  document.querySelectorAll(".sortbtn[data-metric]").forEach(b=>b.classList.toggle("active",b.dataset.metric===state.sortMetric));
  document.querySelectorAll(".sortbtn[data-plat]").forEach(b=>b.classList.toggle("active",b.dataset.plat===state.sortPlat));
  document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab));
  const scopeTotal=scope().length;
  document.getElementById("meta").innerHTML=rows.length===scopeTotal?`Showing all <b>${scopeTotal}</b> profiles${tab==='top60'?' in the drilled-down Top 60':''}`:`Showing <b>${rows.length}</b> of <b>${scopeTotal}</b> profiles`;
  document.getElementById("count").textContent=`${rows.length} profiles`;
  const grid=document.getElementById("grid");
  if(!rows.length)grid.innerHTML=`<div class="empty" style="grid-column:1/-1"><h3>No matches</h3><p>Try clearing a filter or searching a different name.</p></div>`;
  else grid.innerHTML=rows.map(card).join("");
}

function updateTabCounts(){const ctAll=document.getElementById("ct-all");const ctTop=document.getElementById("ct-top60");if(ctAll)ctAll.textContent=DATA.length;if(ctTop)ctTop.textContent=DATA.filter(d=>d.top60).length;}
function setFilter(key,val){state[key]=val;render();window.scrollTo({top:0,behavior:'smooth'});}

function resetFilters(){state={q:"",sector:"All",platform:"All",tier:"All",unicef:false,sortMetric:"followers",sortPlat:"best"};tab="all";document.getElementById("search").value="";render();}
function setSort(m){state.sortMetric=m;render();}
function setSortPlat(p){state.sortPlat=p;render();}
// ---- Tooltip definitions (plain English for stakeholders) ----
const TIPS = {
  aqs: "Audience Quality Score — measures how genuine and active an influencer's followers are, out of 100.\n\n80–100: Excellent · 60–79: Good · 40–59: Average · Below 40: Poor\n\nA higher score means fewer fake or inactive accounts.",
  er: "Engagement Rate — the percentage of followers who actively interact with a post (likes, comments, shares).\n\nAbove 5%: High · 2–5%: Good · Below 2%: Low\n\nHigher engagement means the audience is genuinely interested.",
  brandSafety: "Brand Safety — assesses whether an influencer's content is appropriate for an organisation like UNICEF.\n\n✅ Safe: content is suitable for partnership\n⚠️ Risky: some caution advised\n❌ Not Safe: content not recommended for association.",
  engScore: "Engagement Score (0–100) — a composite measure of how actively and genuinely an influencer's audience interacts with their content. Combines engagement rate and audience quality (AQS).",
  riskScore: "Risk Score (0–100) — assesses reputational risk for UNICEF partnership. Lower is better.\n\n0–33: Low risk ✅ · 34–66: Moderate ⚠️ · 67–100: High risk ❌\n\nBased on brand safety ratings and audience authenticity.",
  partnerScore: "Partnership Potential (0–100) — overall suitability for UNICEF collaboration. Combines audience reach, engagement quality, content safety, and whether the influencer has previously worked with UNICEF.",
  tier: "Influencer tier by total follower count across all platforms:\n\nMega: 1M+ · Macro: 500K–1M\nMid: 100K–500K · Micro: 10K–100K\nNano: below 10K",
  followers: "Total number of people following this influencer on this platform.",
};
function tip(text, cls=''){return `data-tip="${text.replace(/"/g,'&quot;').replace(/\n/g,'&#10;')}" ${cls?`class="${cls}"`:''}`;}
function tipIcon(key,cls=''){return `<i class="tip-icon" ${tip(TIPS[key]||key,cls)}>i</i>`;}

function aqsClass(v){if(v==null)return"";if(v>=80)return"aqs-ex";if(v>=60)return"aqs-go";if(v>=40)return"aqs-av";return"aqs-po";}
function aqsLabel(v){if(v==null)return"";if(v>=80)return"Excellent";if(v>=60)return"Good";if(v>=40)return"Average";return"Poor";}
function bsClass(v){if(!v)return"";const l=v.toLowerCase();if(l.includes("unsafe")||l.includes("high risk"))return"bs-unsafe";if(l.includes("risky")||l.includes("medium")||l.includes("moderate"))return"bs-risky";return"bs-safe";}
function bsLabel(v){if(!v)return"";const l=v.toLowerCase();if(l.includes("safe")&&!l.includes("un"))return"Safe";if(l.includes("unsafe"))return"Not Safe";return v.replace(/_/g," ").replace(/\b\w/g,c=>c.toUpperCase());}
function modalPlat(d,p){
  const pl=d[p];if(!pl||(!pl.link&&!pl.followers&&pl.er==null))return "";

  const er=pl.er!=null?`<span class="mp-er ${erClass(pl.er)}" ${tip(TIPS.er)}>${pl.er.toFixed(1)}%</span>`:`<span class="mp-er er-lo">·</span>`;
  const open=pl.link?`href="${pl.link}" target="_blank" rel="noopener"`:"";
  const aqsBadge=pl.aqs!=null?`<span class="aqs-badge ${aqsClass(pl.aqs)}" ${tip(TIPS.aqs)}>AQS ${pl.aqs} · ${aqsLabel(pl.aqs)}</span>`:"";
  const bsBadge=pl.brand_safety?`<span class="bs-badge ${bsClass(pl.brand_safety)}" ${tip(TIPS.brandSafety)}>${bsLabel(pl.brand_safety)}</span>`:"";

function qualScoresHtml(d){

        <span style="font-size:10px;color:var(--muted);font-weight:600">/100</span>
      </div>
      <div class="score-track" style="height:8px;border-radius:4px;margin-bottom:8px"><div class="score-fill ${fillCls}" style="width:${pct}%;height:100%"></div></div>

function barRows(items,maxPct){
  if(!items||!items.length)return "";

}
function genderBlock(gender,label){

function ageBlock(age,label){

}
function audienceSection(d){
  if(!d.top60)return "";
  const blocks=[];
  // categories
  const cats=(d.instagram&&d.instagram.categories)||[];
  if(cats.length) blocks.push(`<div class="aud-block full"><div class="aud-bt">Content Categories</div><div class="cats-wrap">${cats.slice(0,10).map(c=>`<span class="cat-tag">${c}</span>`).join("")}</div></div>`);
  // countries
  const igC=d.instagram&&d.instagram.audience&&d.instagram.audience.countries;
  const ttC=d.tiktok&&d.tiktok.audience&&d.tiktok.audience.countries;
  if(igC) blocks.push(`<div class="aud-block"><div class="aud-bt">IG · Audience Countries</div>${barRows(igC.slice(0,5))}</div>`);
  if(ttC) blocks.push(`<div class="aud-block"><div class="aud-bt">TT · Audience Countries</div>${barRows(ttC.slice(0,5))}</div>`);
  // languages
  const igL=d.instagram&&d.instagram.audience&&d.instagram.audience.languages;

  if(ttL) blocks.push(`<div class="aud-block"><div class="aud-bt">TT · Audience Languages</div>${barRows(ttL.slice(0,5))}</div>`);

}

// ---- Tooltip engine (body-level, never clipped) ----
(function(){
  const tt=document.getElementById("tt");
  let hideTimer;
  function show(el){
    clearTimeout(hideTimer);
    const text=el.getAttribute("data-tip");
    if(!text)return;
    tt.textContent=text.replace(/&#10;/g,'\n');
    tt.classList.add("show");
    const r=el.getBoundingClientRect();
    const tw=240,th=tt.offsetHeight||80;
    const vw=window.innerWidth,vh=window.innerHeight;
    // Prefer above; fall back to below
    const spaceAbove=r.top,spaceBelow=vh-r.bottom;
    const above=spaceAbove>=th+14||spaceAbove>=spaceBelow;
    tt.classList.toggle("tt-above",above);
    tt.classList.toggle("tt-below",!above);
    // Horizontal: centre on element, clamp to viewport
    let left=r.left+r.width/2-tw/2;
    left=Math.max(8,Math.min(left,vw-tw-8));
    const top=above?r.top-th-12:r.bottom+10;
    tt.style.left=left+"px";
    tt.style.top=top+"px";
    tt.style.width=tw+"px";
    // Arrow offset relative to tooltip box
    const arrowLeft=Math.min(Math.max(r.left+r.width/2-left,14),tw-14);
    tt.style.setProperty("--ax",arrowLeft+"px");
  }
  function hide(){hideTimer=setTimeout(()=>tt.classList.remove("show"),80);}
  document.addEventListener("mouseover",e=>{
    const el=e.target.closest("[data-tip]");
    if(el)show(el);else hide();
  });
  document.addEventListener("mouseout",e=>{
    if(!e.relatedTarget||!e.relatedTarget.closest("[data-tip]"))hide();
  });
  document.addEventListener("scroll",hide,true);
  document.addEventListener("click",hide,true);
})();



// ── Avatar Queue Loader ────────────────────────────────────────────
(function(){
  const CACHE='ava2_';
  const queue=[];let active=0;const MAX=8;

  async function tryUrl(url,attempt){
    attempt=attempt||0;
    try{
      const r=await fetch(url,{method:'HEAD',cache:'force-cache'});
      if(r.ok)return url;
      if(r.status===429&&attempt<3){await new Promise(r=>setTimeout(r,800*(attempt+1)));return tryUrl(url,attempt+1);}
      return null;
    }catch(e){return null;}
  }

  async function loadAvatar(div){
    const key=div.dataset.avaKey;
    const img=div.querySelector('img');
    const span=div.querySelector('.initials');
    if(!img||!key)return;
    // check localStorage cache
    let cached;try{cached=localStorage.getItem(CACHE+key);}catch(e){}
    if(cached){img.src=cached;img.style.display='';if(span)span.style.display='none';return;}
    let cands;try{cands=JSON.parse(div.dataset.avaCands||'[]');}catch(e){cands=[];}
    for(const url of cands){
      const ok=await tryUrl(url);
      if(ok){img.src=ok;img.style.display='';if(span)span.style.display='none';
        try{localStorage.setItem(CACHE+key,ok);}catch(e){}return;}
    }
    // all failed — show initials (already visible)
  }

  function next(){
    while(active<MAX&&queue.length){
      active++;
      const div=queue.shift();
      loadAvatar(div).finally(()=>{active--;next();});
    }
  }

  function enqueue(div){
    if(div.dataset.avaQueued)return;
    div.dataset.avaQueued='1';
    queue.push(div);next();
  }

  const obs=new IntersectionObserver(entries=>{
    entries.forEach(e=>{if(e.isIntersecting){obs.unobserve(e.target);enqueue(e.target);}});
  },{rootMargin:'400px'});

  function observe(){
    document.querySelectorAll('.avatar[data-ava-cands]').forEach(div=>{
      if(!div.dataset.avaQueued)obs.observe(div);
    });
  }

  // Hook into render() to observe new cards after re-render
  const _render=window.render;
  window.render=function(){_render.apply(this,arguments);setTimeout(observe,60);};

  // Hook into openModal to immediately load modal avatar
  const _openModal=window.openModal;
  window.openModal=function(idx){
    _openModal.apply(this,arguments);
    setTimeout(()=>{
      document.querySelectorAll('#modal .avatar[data-ava-cands]').forEach(div=>{
        div.dataset.avaQueued='';enqueue(div);
      });
    },30);
  };

  observe();
})();
</script></body></html>
